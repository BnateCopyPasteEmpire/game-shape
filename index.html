/* ===================== BRAND (shared tokens for every Game Shape app + intake) ===================== */
:root{
  --bg:#ffffff; --surface:#f7f8f6; --line:#e6e9e4; --ink:#0d1210; --ink-2:#55605a; --dim:#9aa39e;
  --green:#013919; --green-2:#0e5a2e; --green-tint:#e8f1eb; --orange:#ff8200; --orange-rgb:255,130,0; --orange-ink:#b85c00; --orange-tint:#fff1e2; --danger:#c62828; --danger-tint:#fdecec;
  /* legacy aliases used by the engine's templates */
  --card:#ffffff; --card2:var(--surface); --text:var(--ink); --muted:var(--ink-2); --accent:var(--orange); --accent2:var(--green); --warn:var(--orange-ink); --bad:var(--danger);
  --LEG_DAY:#ff8200; --PRE_COURT:#0e5a2e; --GAME_DAY:#013919; --PRACTICE_DAY:#2f7a4f; --RECOVERY:#6ba37e; --FLEX:#d9a21b;
  --shadow:0 1px 2px rgba(1,57,25,.04),0 8px 24px rgba(1,57,25,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior-y:none}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:48px}
textarea{min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--danger);min-height:40px;border:0;background:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0}
.top{position:sticky;top:0;z-index:20;display:block;padding:calc(var(--st) + 14px) 18px 12px;background:linear-gradient(#fff 78%,rgba(255,255,255,0))}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.brandrow>img{height:22px;display:block;margin-top:2px}
.cpe{text-align:right;line-height:1.15}
.cpe-mark{font-size:10.5px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--green);white-space:nowrap}
.cpe-mark i{display:inline-block;width:6px;height:6px;border-radius:1.5px;background:var(--orange);margin-right:5px;vertical-align:1px}
.cpe-mark sup{font-size:7px;letter-spacing:0;margin-left:1px;vertical-align:5px}
.cpe-logo{height:30px;width:auto;display:block;margin-left:auto;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cpe-date{font-size:11px;font-weight:700;color:var(--ink-2);margin-top:3px;white-space:nowrap}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
.eyebrow{color:var(--ink-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.iconbtn{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--green)}
main{position:relative;padding:0 16px calc(var(--sb) + 100px);max-width:640px;margin:0 auto}
main>*{position:relative;z-index:1}
.art{position:absolute!important;z-index:0!important;pointer-events:none}
.art svg{display:block;width:100%;height:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(var(--sb) + 6px);background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;font-size:10px;min-width:0;font-weight:700;color:var(--dim);position:relative}
.tabbar button.on{color:var(--green)}
.tabbar button.on:after{content:"";position:absolute;bottom:-2px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.tabbar svg{width:24px;height:24px}
.card{background:#fff;border-radius:20px;padding:16px;margin:0 0 14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.card h3{margin:16px 0 8px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-2)} .small{font-size:13px} .big{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--T) 14%,#fff);border:1px solid color-mix(in srgb,var(--T) 30%,#fff)}
.badge.GAME_DAY{border:1.5px solid var(--orange);background:var(--green);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--T)}
.badge.GAME_DAY .dot{background:var(--orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--orange);color:var(--ink);border:0;box-shadow:0 6px 16px rgba(var(--orange-rgb),.25)}
.btn.green{background:var(--green);color:#fff;border:0}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--danger)}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip.pain.on{background:var(--danger);border-color:var(--danger);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--green);display:flex;align-items:center;gap:4px}
.tile .k{font-size:11px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#fff 55%,var(--orange-tint))}
.hero .swoosh{position:absolute;left:-30px;bottom:-34px;width:260px;opacity:.09;pointer-events:none}
.hero h2{color:var(--ink)}
.identity{font-size:15px;color:var(--ink-2);font-style:italic;margin-top:8px}
.banner{border-radius:14px;padding:14px;margin-bottom:14px;font-size:14px;border:1px solid var(--line);border-left:4px solid;background:#fff;position:relative;z-index:1}
.banner.warn{background:var(--orange-tint);border-left-color:var(--orange)}
.banner.bad{background:var(--danger-tint);border-left-color:var(--danger)}
.banner.info{background:var(--green-tint);border-left-color:var(--green)}
.banner b{display:block;margin-bottom:4px;font-size:15px;color:var(--ink)}
.check{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.check:last-child{border-bottom:0}
.check .t{width:64px;font-size:12px;color:var(--ink-2);font-weight:700;flex:none}
.check .lbl{flex:1}
.box{width:28px;height:28px;border-radius:50%;border:2px solid #cfd5cf;display:grid;place-items:center;flex:none;transition:all .15s}
.on>.box,.box.on{background:var(--orange);border-color:var(--orange)}
.box svg{width:15px;height:15px;opacity:0}
.on>.box svg,.box.on svg{opacity:1}
.check.on .lbl{color:var(--ink-2);text-decoration:line-through;text-decoration-color:#c9cfc9}
.pop{animation:pop .15s ease}
@keyframes pop{50%{transform:scale(1.22)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border-radius:14px;padding:8px 2px;text-align:center;background:#fff;border:1.5px solid var(--line);min-height:74px;color:var(--ink)}
.day .d{font-size:11px;color:var(--ink-2);font-weight:700}
.day .n{font-size:18px;font-weight:800}
.day .ty{height:5px;border-radius:3px;margin:6px 8px 0}
.day .mk{height:14px;margin-top:3px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--green)}
.day.sel{border-color:var(--green);box-shadow:0 0 0 2px var(--green-tint)}
.day.today .n{color:var(--orange-ink)}
.ex{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.ex .nm{font-weight:800;font-size:16px}
.ex .meta{font-size:13px;color:var(--ink-2)}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.set{width:52px;height:52px;border-radius:50%;border:2px solid #cfd5cf;font-weight:800;display:grid;place-items:center;background:#fff;color:var(--ink);transition:all .15s}
.set.on{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.cues{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.list{margin:0;padding-left:18px}
.list li{margin:6px 0}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 120px)}
.hidden{display:none!important}
.sheet{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(13,18,16,.35)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(var(--sb) + 24px);animation:up .25s ease;box-shadow:0 -10px 40px rgba(1,57,25,.12)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:#d5dad5;margin:0 auto 12px}
.sheet-title{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.sheet-title img{width:30px;height:30px;border-radius:8px}
.sheet-title h2{margin:0;font-size:22px;font-weight:800}
.restbar{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 16px);z-index:55;background:var(--green);color:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:20px;box-shadow:0 10px 30px rgba(1,57,25,.35)}
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%) translateY(-140px);z-index:80;background:var(--green);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .3s;max-width:90vw;box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%) translateY(0)}
.ring{position:relative;width:110px;height:110px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:22px;line-height:1.1;color:var(--green)}
.ring .c small{display:block;font-size:11px;color:var(--ink-2);font-weight:700}
details{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;z-index:1}
details>summary{list-style:none;padding:16px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center;min-height:56px}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"+";color:var(--orange-ink);font-size:22px}
details[open]>summary:after{content:"\2212"}
details .in{padding:0 16px 16px}
details details{box-shadow:none}
.recipe{border-top:1px solid var(--line);padding:14px 0}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.macros span{font-size:12px;font-weight:700;background:var(--green-tint);color:var(--green);border-radius:8px;padding:4px 8px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 4px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700;color:var(--ink)}
.menu button .mi{width:34px;height:34px;border-radius:10px;background:var(--green-tint);color:var(--green);display:grid;place-items:center;flex:none}
.menu button .mi svg{width:19px;height:19px}
.menu button .chev{margin-left:auto;color:var(--dim)}
label.f{display:block;font-size:13px;color:var(--ink-2);font-weight:700;margin:12px 0 6px}
.xpbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffb15c)}
.bdg{display:inline-flex;flex-direction:column;align-items:center;gap:6px;width:31%;padding:12px 4px;border-radius:14px;margin:0 1% 8px;text-align:center;font-size:12px;font-weight:800;color:var(--ink)}
.bdg .e{width:52px;height:52px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:var(--orange)}
.bdg .e svg{width:26px;height:26px}
.bdg.off{color:var(--dim)}
.bdg.off .e{background:#fff;border:2px dashed #d5dad5;color:#c3c9c3}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--green);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line)}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
.empty{text-align:center;padding:18px 8px;color:var(--ink-2);font-size:14px}
.empty img{width:72px;height:72px;border-radius:18px;opacity:.12;display:block;margin:0 auto 10px}
.pill-r{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
.done-hero{position:relative;text-align:center;padding:18px 0 6px}
.done-hero:before{content:"";position:absolute;left:50%;top:6px;width:200px;height:200px;transform:translateX(-50%);background:radial-gradient(circle,rgba(var(--orange-rgb),.22),rgba(var(--orange-rgb),0) 65%)}
.done-hero img{position:relative;width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(1,57,25,.25)}
.done-hero h2{position:relative;font-size:26px;margin:14px 0 2px}
.ver{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:var(--dim);font-size:12px;font-weight:700}
.ver img{height:14px}
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:opacity .45s}
#splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 14px 40px rgba(1,57,25,.25);animation:splashIn .6s ease both}
#splash .wm{position:absolute;bottom:calc(var(--sb) + 60px);height:26px;animation:splashIn .6s .15s ease both}
@keyframes splashIn{from{opacity:0;transform:scale(.88)}}
#updateBar{position:fixed;left:12px;right:12px;top:calc(var(--st) + 10px);z-index:90;background:var(--green);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(1,57,25,.3)}
#updateBar img{width:34px;height:34px;border-radius:9px}
#updateBar .tx{flex:1;font-size:14px;line-height:1.25}
#updateBar .tx b{display:block;font-size:15px}
#updateBar button{background:var(--orange);color:var(--ink);font-weight:800;border-radius:11px;min-height:40px;padding:0 14px}
.wm-bg{position:fixed;right:-80px;bottom:calc(var(--sb) + 64px);width:380px;max-width:90vw;opacity:.07;z-index:0;pointer-events:none;user-select:none}
.signoff{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 6px;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.3px;position:relative;z-index:1}
.signoff img{width:22px;height:22px;flex:none}
.signoff{flex-wrap:wrap;text-align:center}
.signoff .ball{color:var(--orange-ink);font-weight:900;letter-spacing:.5px}
.card h2.brand{display:flex;align-items:center;gap:8px}
.card h2.brand:before{content:"";width:20px;height:20px;flex:none;background:url(gs-mark.png) center/contain no-repeat}
.wo-mark{width:30px;height:30px}
.hero-top{display:flex;align-items:center;gap:12px;margin-top:10px}
.hero-top img{width:52px;height:52px;border-radius:13px;box-shadow:0 6px 16px rgba(1,57,25,.22);flex:none}
.hero-top h2{margin:0!important}
.cover{position:relative;border-radius:8px 10px 10px 8px;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;flex:none;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 4px 10px rgba(1,57,25,.14);text-align:left}
.cover .ct{font-weight:900;line-height:1.08;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover .ca{font-size:9px;font-weight:700;opacity:.85;line-height:1.1}
.cover img{position:absolute;right:5px;bottom:5px;width:14px;height:14px;opacity:.9}
.cover .rib{position:absolute;top:6px;left:6px;background:var(--orange);color:var(--ink);font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;letter-spacing:.5px}
.cover.pk .ct{margin-top:14px}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.carousel .cv{scroll-snap-align:start;flex:none}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chiprow .chip{flex:none;white-space:nowrap;min-height:40px}
.bk{display:flex;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);align-items:flex-start}
.bk:last-child{border-bottom:0}
.bi{flex:1;min-width:0}
.bt{font-weight:800;font-size:15px;line-height:1.2}
.ba{font-size:12px;color:var(--ink-2);margin-top:2px}
.bw{font-size:13px;color:var(--ink-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bp{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bp .cat{font-size:11px;font-weight:800;color:var(--green);background:var(--green-tint);border-radius:6px;padding:2px 7px}
.tg{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.tg.spice{color:#7a1f3d;background:#fbeef2;border-color:#f1d2dc}
.tg.comm{color:var(--green);background:var(--green-tint);border-color:#cfe2d5}
.tg.shelf{color:var(--orange-ink);background:var(--orange-tint);border-color:#ffd9b0}
.pbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;background:var(--orange)}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;color:#d5dad5;min-width:44px;min-height:44px}
.stars button.on{color:var(--orange)}
.sh3{margin:16px 0 8px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
a.btn{text-decoration:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--ink);font-weight:700}
.toggle .sw{width:50px;height:30px;border-radius:15px;background:#d5dad5;position:relative;flex:none;transition:background .2s}
.toggle .sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle.on .sw{background:var(--green)}
.toggle.on .sw:after{left:23px}
.imp{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.imp .mi{width:44px;height:44px;border-radius:12px;background:var(--orange-tint);color:var(--orange-ink);display:grid;place-items:center;flex:none;font-size:22px}
.imp b{display:block;font-size:16px}
.rvlist{margin-top:10px}
.rvrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rvrow.off .bt,.rvrow.off .ba{opacity:.5}
.rvi{flex:1;min-width:0;cursor:pointer}
.rvedit{margin-top:8px;padding:10px;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.rvedit input,.rvedit select{min-width:0;padding:10px 8px}
.evrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.evrow.cx .lbl b{text-decoration:line-through;color:var(--ink-2)}
.evi{display:flex;gap:12px;flex:1;text-align:left;color:var(--ink);min-width:0}
.evi .t{width:44px;flex:none;font-weight:800;font-size:13px;color:var(--green)}
.maprow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.maprow select{width:150px}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.75}}
.btn[disabled]{opacity:.45}
.howto{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:800;color:var(--green);text-decoration:none;background:var(--green-tint);border-radius:10px;padding:8px 12px}
.wrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.wrow .check{border-bottom:0}
.hq{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-tint);color:var(--green);font-size:12px;text-decoration:none}
.le{margin-top:8px}
.lerow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.lerow input,.lerow textarea{flex:1;min-width:0;min-height:44px;padding:10px}
.lerow textarea{min-height:58px;resize:none;line-height:1.3}
.lerow input.tm{flex:0 0 112px}
.lebtn{flex:none;width:40px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--ink-2)}
.lebtn.del{color:var(--danger)}
.lebtn[disabled]{opacity:.3}
ol.aff{margin:10px 0 0;padding-left:20px}
ol.aff li{margin:8px 0;font-size:16px;font-weight:600}
/* Tab bar flair: breathing green + orange gradient */
@keyframes gsFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes gsBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes gsGlow{0%,100%{opacity:.75;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}
.tabbar{border-top:0}
.tabbar:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,#013919,var(--orange),#0e5a2e,var(--orange),#013919);background-size:300% 100%;animation:gsFlow 6s ease-in-out infinite}
.tabbar button{isolation:isolate}
.tabbar button svg{stroke:url(#gsTabGrad);opacity:.8;animation:gsBreathe 3.2s ease-in-out infinite;transform-origin:center}
.tabbar button:nth-child(3) svg{animation-delay:.25s}.tabbar button:nth-child(4) svg{animation-delay:.5s}.tabbar button:nth-child(5) svg{animation-delay:.75s}.tabbar button:nth-child(6) svg{animation-delay:1s}.tabbar button:nth-child(7) svg{animation-delay:1.25s}
.tabbar .tl{background:linear-gradient(90deg,#0f7a3f,var(--orange),#0f7a3f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gsFlow 4s ease-in-out infinite;opacity:.8;font-weight:800}
.tabbar button.on svg{opacity:1;stroke-width:2.5}
.tabbar button.on .tl{opacity:1;font-weight:900}
.tabbar button.on:before{content:"";position:absolute;inset:2px 8px 10px;border-radius:16px;z-index:-1;background:linear-gradient(120deg,rgba(1,57,25,.16),rgba(var(--orange-rgb),.26),rgba(1,57,25,.16));background-size:200% 200%;animation:gsFlow 4s ease-in-out infinite,gsGlow 3.2s ease-in-out infinite;box-shadow:0 0 16px rgba(var(--orange-rgb),.25)}
.tabbar button.on:after{background:linear-gradient(90deg,var(--orange),#0e5a2e);width:18px;height:4px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v2.7 polish: tighter layout, no sideways drift, tap glow, scroll reveal, sports art, badge shine ===== */
html{overflow-x:clip}
body{touch-action:pan-y pinch-zoom}
main{padding:0 12px calc(var(--sb) + 100px);overflow-x:clip}
.top{padding:calc(var(--st) + 12px) 14px 10px}
.card{padding:14px;margin:0 0 12px;border-radius:18px}
.grid3,.grid2{gap:8px}
img,svg,video{max-width:100%}
/* tap glow in each person's color */
.btn,.chip,.iconbtn,.tile,.menu button,.sbrow,.tabbar button,a.btn,[data-act]{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .25s ease,background-color .2s ease}
.btn:active,.chip:active,.iconbtn:active,.menu button:active,a.btn:active,.tile:active{transform:scale(.97);box-shadow:0 0 0 4px rgba(var(--orange-rgb),.22),0 6px 18px rgba(var(--orange-rgb),.28)}
.tabbar button:active{transform:scale(.94)}
.tapfx{position:fixed;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(var(--orange-rgb),.42) 0%,rgba(var(--orange-rgb),.12) 45%,rgba(var(--orange-rgb),0) 70%);transform:translate(-50%,-50%) scale(.2);opacity:1;animation:tapfx .55s ease-out forwards;z-index:99}
@keyframes tapfx{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* scroll reveal */
.rv{opacity:0;transform:translateY(14px) scale(.99);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
/* subtle sports art layer */
#sportsArt{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sportsArt svg{position:absolute;opacity:.045;will-change:transform}
/* profile badge with slow color shine */
.pbadge{position:relative;display:block;width:132px;height:132px;margin:4px auto 10px;border-radius:26%;overflow:hidden;box-shadow:0 10px 30px rgba(var(--orange-rgb),.28),0 2px 6px rgba(0,0,0,.25);animation:pbHue 14s ease-in-out infinite}
.pbadge img{width:100%;height:100%;display:block}
.pbadge:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.38) 50%,rgba(255,255,255,0) 60%);transform:translateX(-60%);animation:pbShine 6s ease-in-out infinite}
.pbadge.big{width:min(72vw,300px);height:min(72vw,300px)}
@keyframes pbHue{0%,100%{filter:hue-rotate(0deg) saturate(1) brightness(1)}50%{filter:hue-rotate(-14deg) saturate(1.15) brightness(1.06)}}
@keyframes pbShine{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
/* welcome surprise */
.welcome{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 32%,rgba(var(--orange-rgb),.32),rgba(1,57,25,0) 58%),linear-gradient(160deg,#013919,#00230f);color:#fff;animation:wIn .5s ease}
.welcome h2{margin:6px 0 4px;font-size:26px;letter-spacing:-.4px}
.welcome p{margin:4px 0;opacity:.9}
.welcome .btn{margin-top:18px;min-width:220px}
.welcome .pbadge{animation:pbHue 14s ease-in-out infinite,wPop .9s cubic-bezier(.2,1.4,.4,1)}
.confetti{position:fixed;top:-12px;width:8px;height:14px;border-radius:2px;z-index:81;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
@keyframes wIn{from{opacity:0}to{opacity:1}}
@keyframes wPop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.pbadge,.pbadge:after,.tapfx,.confetti{animation:none!important}#sportsArt svg{transform:none!important}}
/* badge unlock burst */
.bburst{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(var(--orange-rgb),.38),rgba(1,57,25,0) 60%),linear-gradient(160deg,#013919,#00230f);color:#fff;text-align:center;animation:wIn .25s ease}
.bburst.out{opacity:0;transition:opacity .3s}
.bb-rays{position:absolute;top:42%;left:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0 8deg,rgba(255,255,255,0) 8deg 22deg);border-radius:50%;animation:bbSpin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.bb-medal{position:relative;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--orange) 55%,#7a3a00);box-shadow:0 0 0 6px rgba(255,255,255,.18),0 0 40px rgba(var(--orange-rgb),.8);animation:bbPop .7s cubic-bezier(.2,1.6,.4,1)}
.bb-medal span{width:58px;height:58px;color:#013919;display:grid;place-items:center}.bb-medal svg{width:58px;height:58px}
.bb-eyebrow{margin-top:22px;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.bb-name{font-size:28px;font-weight:900;letter-spacing:-.4px;margin-top:4px;animation:bbUp .5s .15s both}
.bb-pts{margin-top:6px;font-size:20px;font-weight:900;color:var(--orange);animation:bbUp .5s .3s both}
.bb-tap{margin-top:26px;font-size:12px;opacity:.6}
.bb-spark{position:absolute;top:42%;left:50%;width:8px;height:8px;border-radius:2px;animation:bbSpark .9s ease-out both}
@keyframes bbSpin{to{transform:rotate(360deg)}}
@keyframes bbPop{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes bbUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes bbSpark{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3) rotate(260deg);opacity:0}}
/* rulebook */
.rb details{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:8px 0;background:#fff}
.rb summary{font-weight:800;padding:10px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.rb summary:after{content:"+";font-size:20px;color:var(--orange-ink)}
.rb details[open] summary:after{content:"\2212"}
.rb .bprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.rb .bprog i{display:block;height:100%;background:var(--orange)}
@media (prefers-reduced-motion:reduce){.bb-rays,.bb-medal,.bb-spark,.bb-name,.bb-pts{animation:none!important}}
/* team + brand badges, top right on every screen */
:root{--epc-purple:#4a2d76;--epc-purple-rgb:74,45,118;--epc-teal:#4eb0d6;--epc-teal-rgb:78,176,214}
.hdr-badges{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.epc-chip{display:inline-flex;align-items:center;height:30px;padding:3px 8px;border-radius:10px;background:linear-gradient(135deg,var(--epc-purple),#2f1b50);box-shadow:0 0 0 1px rgba(var(--epc-teal-rgb),.55) inset,0 3px 10px rgba(var(--epc-purple-rgb),.35)}
.epc-chip img{height:22px;width:auto;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}

.cpe-date{margin-top:4px}
/* tap blur in EPC Tropics purple + teal */

.btn:active,.chip:active,.iconbtn:active,.menu button:active,a.btn:active,.tile:active{box-shadow:0 0 0 4px rgba(var(--epc-teal-rgb),.25),0 6px 18px rgba(var(--epc-purple-rgb),.30)}

.mburst.out{opacity:0;transition:opacity .3s}

.mb-rays{position:absolute;top:40%;left:50%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.22) 0 7deg,rgba(255,255,255,0) 7deg 20deg);border-radius:50%;animation:bbSpin 7s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%)}
.m-golden .mb-rays{background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.35) 0 6deg,rgba(78,176,214,.12) 6deg 12deg,rgba(255,255,255,0) 12deg 20deg);animation-duration:4s}
.mb-medal{position:relative;z-index:1}

/* Opening Day show */
.show-hd{text-align:center;margin:6px 0 12px}.show-hd h2{margin:4px 0;font-size:24px;letter-spacing:-.4px}
.show-total{text-align:center;margin:6px 0 12px}.show-total span{display:block;font-size:56px;font-weight:900;color:var(--green);line-height:1;letter-spacing:-1px}.show-total small{color:var(--ink-2);font-weight:700}
.show-total.bump span{animation:bump .4s ease}
@keyframes bump{50%{transform:scale(1.15);color:var(--orange-ink)}}
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.task{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;text-align:left;min-height:56px}
.task span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:900;color:var(--green);flex:none}
.task b{flex:1;font-size:14px}.task em{font-style:normal;font-weight:900;color:var(--orange-ink)}
.task.on{border-color:var(--green);background:var(--green-tint);animation:bump .35s ease}.task.on span{background:var(--green);color:#fff}
.allin-hint{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;text-align:center}
.allin-hint.on{background:var(--green);color:#fff;animation:bump .5s ease}
.week-demo{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:background .25s}
.wd small{font-weight:800;color:var(--ink-2)}.wd b{font-size:18px}.wd i{font-style:normal;font-size:8px;letter-spacing:1px;color:var(--green)}
.wd.h3{background:#cfe6d6}.wd.h4{background:var(--green);color:#fff}.wd.h4 small,.wd.h4 i{color:#fff}
.ladder{display:flex;gap:8px}.ladder-step{flex:1;display:flex;align-items:center;gap:6px;padding:8px;border-radius:12px;border:1px dashed var(--line);opacity:.45;filter:grayscale(.8);transition:all .3s}
.ladder-step.lit{opacity:1;filter:none;border-style:solid;border-color:var(--green);background:var(--green-tint)}
.ladder-step.pop{animation:bump .5s ease}
.month-demo .md-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);opacity:0;animation:bbUp .4s both}
.md-row b{width:48px}.md-row em{margin-left:auto;font-style:normal;font-weight:900;color:var(--green)}
.md-m{opacity:0;animation:bbPop .5s both}
.golden-win{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#2f1b50,#4a2d76);color:#fff;animation:bbUp .5s 1.2s both}
.season-line{display:flex;justify-content:space-between;gap:8px;position:relative;margin:4px 0 12px}
.season-line:before{content:"";position:absolute;top:27px;left:12%;right:12%;height:3px;background:linear-gradient(90deg,var(--orange),#ffd75e,var(--green));border-radius:2px}
.sl-step{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:0;animation:bbPop .6s both}
.sl-step small{color:var(--ink-2);font-weight:700}
.season-flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-weight:800;font-size:13px}
.season-flow span{padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}.season-flow i{font-style:normal;color:var(--orange-ink)}
.season-flow .win{background:var(--green);color:#fff;border-color:var(--green)}
/* medal ladder on Today */
.mladder{display:flex;gap:8px;margin-top:10px}
.mladder .ms{flex:1;text-align:center;padding:8px 4px;border-radius:12px;border:1px solid var(--line);position:relative}
.mladder .ms.got{border-color:var(--green);background:var(--green-tint)}
.mladder .ms.next{border:2px solid var(--orange);animation:dangle 2.4s ease-in-out infinite}
.mladder .ms:not(.got) svg{filter:grayscale(.6);opacity:.55}
.mladder .ms.next svg{filter:none;opacity:1}
.mladder b{display:block;font-size:13px}.mladder small{color:var(--ink-2);font-weight:700}
@keyframes dangle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
.odcount{text-align:center}.odcount .n{font-size:44px;font-weight:900;color:var(--green);line-height:1}
.sheet-panel.tall{min-height:88vh}
</style>
</head>

function myWeekScore(ws) {
  const t = todayStr(); const st = { workouts: 0, quick: 0, active: 0, water: 0, protein: 0, readMin: 0, sleep: 0, miles: 0 };
  for (let i = 0; i < 7; i++) {
    const s = addDays(ws, i); if (s > t) break; const l = S.logs[s]; if (!l) continue;

    st.milesPts = (st.milesPts || 0) + Math.min(6, +l.miles || 0) * 5; st.miles += +l.miles || 0;

  delete st.milesPts; st.miles = Math.round(st.miles * 10) / 10;

}

function chart(field, unit, color) {
  const pts = S.body.filter(b => b[field]).sort((a, b) => a.date < b.date ? -1 : 1);

  const vals = pts.map(p => +p[field]), mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1, W = 320, H = 120;
  const xy = pts.map((p, i) => [10 + i * (W - 20) / (pts.length - 1), 10 + (H - 30) * (1 - (p[field] - mn) / rg)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${[0, 1, 2].map(i => `<line x1="0" x2="${W}" y1="${10 + i * (H - 30) / 2}" y2="${10 + i * (H - 30) / 2}" stroke="#e6e9e4"/>`).join("")}<polyline fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" points="${xy.map(p => p.join(",")).join(" ")}"/>${xy.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === xy.length - 1 ? 6 : 3.5}" fill="${i === xy.length - 1 ? "${O}" : color}"/>`).join("")}<text x="10" y="${H - 4}" fill="#55605a" font-size="11">${fmtShort(pts[0].date)}: ${vals[0]} ${unit}</text><text x="${W - 10}" y="${H - 4}" fill="#55605a" font-size="11" text-anchor="end">${fmtShort(pts[pts.length - 1].date)}: ${vals[vals.length - 1]} ${unit}</text></svg>`;
}

/* ---------------------------- CUSTOMIZE (v2.3) ----------------------------
   Everything a person may want to change lives in S.custom and is edited in the app:
   daily times, which checklist items show, personal habits, wind-down steps, Today quotes, features, targets. */
const DEFAULT_TIMES = { wake: "05:00", workout: "05:05", hottub: "05:45", breakfast: "06:30", lunch: "12:00", windDown: "20:00", read: "20:35", bed: "21:00" };
const TIME_LABELS = [["wake", "Wake up + water"], ["workout", "Workout"], ["hottub", "Hot tub"], ["breakfast", "Breakfast"], ["lunch", "Lunch"], ["windDown", "Wind-down starts"], ["read", "Reading"], ["bed", "In bed"]];
const CHECK_ITEMS = [["water_wake", "Water on waking"], ["hottub", "Hot tub"], ["breakfast", "Protein breakfast"], ["lunch", "Protein + veg lunch"], ["electro", "Electrolytes before court"], ["wd_tv", "Wind-down start"], ["wd_read", "Reading"], ["bed", "Bedtime"]];
function C() {
  if (!S.custom) S.custom = {};
  const c = S.custom;
  if (!c.times) c.times = clone(DEFAULT_TIMES);
  for (const k in DEFAULT_TIMES) if (!c.times[k]) c.times[k] = DEFAULT_TIMES[k];
  if (!c.hide) c.hide = {};
  if (!c.habits) c.habits = [];
  if (!c.wind) c.wind = WIND.map(w => ({ id: w[0], time: w[1], label: w[2] }));
  if (!c.identity) c.identity = IDENTITY.slice();
  if (!c.features) c.features = { hotTub: true };
  if (c.waterWakeOz == null) c.waterWakeOz = 16;
  return c;
}

function teamFilter(evs, team, src) {

  if (src.kind === "csv") return GS_SCHED.csvToEvents(src.rows, src.det, { myTeam: team });
  const t = team.toLowerCase();
  return evs.filter(e => !(e.home || e.away) || [e.home, e.away].some(x => (x || "").toLowerCase() === t)).map(e => {
    if (!(e.home || e.away)) return e;
    const home = (e.home || "").toLowerCase() === t, opp = home ? e.away : e.home;

    const changed = dup && (dup.start !== e.start || (e.location && dup.location !== e.location));
    return Object.assign({}, e, { sel: !(e.date < t) && !dup && !(e.conf != null && e.conf < 0.5), past: e.date < t, dup: dup ? dup.id : null, changed, low: e.conf != null && e.conf < 0.75, edit: false });
  });
}
function impactOf(items) {

  const snap = (() => { const m = {}; for (let d = from; d <= to; d = addDays(d, 1)) { const i = dayInfo(d); m[d] = i.type + (i.midday ? "*" : ""); } return m; })();
  const keep = S.events; S.events = keep.filter(e => !sel.some(x => x.dup === e.id)).concat(sel.map(x => normEvent(x, "preview"))); invalidate();

function doImport() {
  const rv = UI.rv, sel = rv.items.filter(x => x.sel); if (!sel.length) return;

  let feedId = null;
  if (rv.src.kind === "feed") { feedId = "f" + Date.now().toString(36); S.feeds.push({ id: feedId, url: rv.src.url, name: rv.src.name, lastSync: new Date().toISOString(), lastHash: GS_SCHED.hashEvents(rv.all), autoSync: true }); }
  sel.forEach(x => {
    const ev = normEvent(x, rv.src.kind, { source: { kind: rv.src.kind, importId, feedId, uid: x.uid || null } });
    if (x.dup) { const i = S.events.findIndex(e => e.id === x.dup); if (i >= 0) { updated.push(clone(S.events[i])); ev.id = S.events[i].id; S.events[i] = ev; return; } }
    S.events.push(ev); added.push(ev.id);
  });
  S.imports.unshift({ id: importId, date: todayStr(), at: Date.now(), kind: rv.src.kind, label: rv.src.label, count: sel.length, added, updated, feedId });

}
function undoImport(id) {
  const im = S.imports.find(x => x.id === id); if (!im) return;
  S.events = S.events.filter(e => !im.added.includes(e.id));
  (im.updated || []).forEach(u => { const i = S.events.findIndex(e => e.id === u.id); if (i >= 0) S.events[i] = u; });
  if (im.feedId) S.feeds = S.feeds.filter(f => f.id !== im.feedId);
  S.imports = S.imports.filter(x => x.id !== id); invalidate(); save(); toast("Import undone"); closeSheet(); render();
}

/* ---------- Feed auto-sync ---------- */
async function syncFeeds(force) {
  if (!onlineHost() || !navigator.onLine || !(S.feeds || []).length) return;
  const changes = [];
  for (const f of S.feeds) {
    if (!f.autoSync && !force) continue;
    if (!force && f.lastSync && Date.now() - new Date(f.lastSync) < 6 * 3600e3) continue;
    try {
      const r = await fetch(SCHED_API.fetch + "?url=" + encodeURIComponent(f.url), { cache: "no-store" }); if (!r.ok) continue;
      const evs = GS_SCHED.parseICS(await r.text()), h = GS_SCHED.hashEvents(evs);
      f.lastSync = new Date().toISOString(); if (h === f.lastHash) continue; f.lastHash = h;
      const mine = S.events.filter(e => e.source && e.source.feedId === f.id), t = todayStr(), seen = new Set();
      evs.forEach(n => {
        const ex = mine.find(e => (n.uid && e.source.uid === n.uid) || GS_SCHED.sameEvent(e, n));
        if (ex) { seen.add(ex.id); if (ex.date !== n.date || ex.start !== n.start || ex.cancelled) { changes.push(ex.title + " moved to " + fmtD(n.date) + (n.start ? " " + fmtT(n.start) : "")); Object.assign(ex, { date: n.date, start: n.start, end: n.end, location: n.location || ex.location, cancelled: false }); } }
        else if (n.date >= t) { const ev = normEvent(n, "feed", { source: { kind: "feed", feedId: f.id, uid: n.uid || null } }); S.events.push(ev); seen.add(ev.id); changes.push("New: " + ev.title + " " + fmtD(ev.date)); }
      });
      mine.forEach(e => { if (!seen.has(e.id) && e.date >= t && !e.cancelled) { e.cancelled = true; changes.push(e.title + " on " + fmtD(e.date) + " was cancelled"); } });
    } catch (e) {}
  }
  if (changes.length) { S.schedAlert = { date: todayStr(), msgs: changes.slice(0, 6) }; invalidate(); }
  save(); if (changes.length) rerenderAll();
}

/* ---------- Phone calendar ---------- */
function calAdd(evs) {

    document.body.appendChild(f); f.submit(); f.remove(); return;
  }
  download("game-shape-schedule.ics", GS_SCHED.toICS(list));
}

/* ---------------------------- UPDATES: auto-update, update bar, What's new ----------------------------
   Release steps: bump APP_VERSION + CHANGELOG here, "version" in version.json, and VERSION in sw.js. Deploy.
   Data lives in localStorage under the same key, so updates never touch anyone's logs. */
const cmpVer = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
function whatsNewHTML() {
  return sheetTitle("What's new") + Object.keys(CHANGELOG).sort((a, b) => cmpVer(b, a)).map(v => `<div class="card"><div class="eyebrow">Version ${v}</div><ul class="list">${CHANGELOG[v].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("") + `<div class="small muted">Updates install on their own. Your workouts, logs, and settings stay saved on your phone.</div>`;
}
function showWhatsNew() {
  const seen = S.meta.seenVersion; if (seen === APP_VERSION) return;
  UI.wnPending = APP_VERSION;   // saved as seen only when they close it, so a reload can't eat it
  const needSetup = needsSetup();
  if (!seen && !Object.keys(S.logs).length) { S.meta.seenVersion = APP_VERSION; UI.wnPending = null; save(); return false; }   // brand new user: nothing to announce
  if (S.meta.tourSeen !== TOUR_V) { UI.tourPage = 0; UI.demo = null; openSheet("tour"); return true; }
  const pitch = !S.meta.seasonHello; S.meta.seasonHello = 1; save();
  openSheet("result", `<div class="done-hero"><img src="icon-512.png" alt=""><h2>${pitch ? "Game Shape Season 1 is here" : "New update: v" + APP_VERSION}</h2><div class="muted">v${APP_VERSION}. All your data is still here. Same link, same home screen icon.</div></div>${pitch ? seasonPitch(false) : ""}<ul class="list">${(CHANGELOG[APP_VERSION] || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${!S.profile.nickname ? `<button class="btn block" style="margin-top:6px" data-act="nickGo">Add my nickname</button>` : ""}${needSetup ? `<button class="btn primary block" style="margin-top:14px" data-act="setupNow">Answer 3 quick questions</button>` : `<button class="btn primary block" style="margin-top:14px" data-act="closeSheet">Let's go</button>`}`);
  return true;
}
async function applyUpdate() {
  save(); window.__gsUpdating = true;
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) for (const r of await navigator.serviceWorker.getRegistrations()) { await r.update(); if (r.waiting) r.waiting.postMessage("SKIP_WAITING"); }
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch (e) {}
  location.reload();
}
async function checkUpdate(auto) {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
    const v = await r.json(); if (!v.version || cmpVer(v.version, APP_VERSION) <= 0) return;
    let tried = null; try { tried = sessionStorage.getItem("gs_upd_try"); } catch (e) {}
    if (auto && tried !== v.version) { try { sessionStorage.setItem("gs_upd_try", v.version); } catch (e) {} return applyUpdate(); }
    const b = $("updateBar");
    b.innerHTML = `<img src="icon-180.png" alt=""><div class="tx"><b>Update ready: v${esc(v.version)}</b>${esc((v.notes || [])[0] || "New features and fixes")}</div><button data-act="doUpdate">Update</button>`;
    b.classList.remove("hidden");
  } catch (e) {}
}
ACT.doUpdate = () => applyUpdate();
// Reload on a new service worker ONLY when the user (or auto-update) asked for it. The page is already served fresh from the network,
// so an unasked reload just wipes whatever is on screen (that's what made the update card flash and vanish).
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("controllerchange", () => { if (window.__gsUpdating && !window.__gsReloaded) { window.__gsReloaded = true; location.reload(); } });
setInterval(() => checkUpdate(false), 30 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(false); });
