<style>
/* ===================== BRAND (shared tokens for every Game Shape app + intake) ===================== */
:root{
  --bg:#ffffff; --surface:#f7f8f6; --line:#e6e9e4; --ink:#0d1210; --ink-2:#55605a; --dim:#9aa39e;
  --green:#013919; --green-2:#0e5a2e; --green-tint:#e8f1eb; --orange:#ff8200; --orange-ink:#b85c00; --orange-tint:#fff1e2; --danger:#c62828; --danger-tint:#fdecec;
  /* legacy aliases used by the engine's templates */
  --card:#ffffff; --card2:var(--surface); --text:var(--ink); --muted:var(--ink-2); --accent:var(--orange); --accent2:var(--green); --warn:var(--orange-ink); --bad:var(--danger);
  --LEG_DAY:#ff8200; --PRE_COURT:#0e5a2e; --GAME_DAY:#013919; --PRACTICE_DAY:#2f7a4f; --RECOVERY:#6ba37e; --FLEX:#d9a21b;
  --shadow:0 1px 2px rgba(1,57,25,.04),0 8px 24px rgba(1,57,25,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior-y:none}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:48px}
textarea{min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--danger);min-height:40px;border:0;background:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0}
.top{position:sticky;top:0;z-index:20;display:block;padding:calc(var(--st) + 14px) 18px 12px;background:linear-gradient(#fff 78%,rgba(255,255,255,0))}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.brandrow>img{height:22px;display:block;margin-top:2px}
.cpe{text-align:right;line-height:1.15}
.cpe-mark{font-size:10.5px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--green);white-space:nowrap}
.cpe-mark i{display:inline-block;width:6px;height:6px;border-radius:1.5px;background:var(--orange);margin-right:5px;vertical-align:1px}
.cpe-mark sup{font-size:7px;letter-spacing:0;margin-left:1px;vertical-align:5px}
.cpe-logo{height:30px;width:auto;display:block;margin-left:auto;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cpe-date{font-size:11px;font-weight:700;color:var(--ink-2);margin-top:3px;white-space:nowrap}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
.eyebrow{color:var(--ink-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.iconbtn{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--green)}
main{position:relative;padding:0 16px calc(var(--sb) + 100px);max-width:640px;margin:0 auto}
main>*{position:relative;z-index:1}
.art{position:absolute!important;z-index:0!important;pointer-events:none}
.art svg{display:block;width:100%;height:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(var(--sb) + 6px);background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;font-size:10px;min-width:0;font-weight:700;color:var(--dim);position:relative}
.tabbar button.on{color:var(--green)}
.tabbar button.on:after{content:"";position:absolute;bottom:-2px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.tabbar svg{width:24px;height:24px}
.card{background:#fff;border-radius:20px;padding:16px;margin:0 0 14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.card h3{margin:16px 0 8px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-2)} .small{font-size:13px} .big{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--T) 14%,#fff);border:1px solid color-mix(in srgb,var(--T) 30%,#fff)}
.badge.GAME_DAY{border:1.5px solid var(--orange);background:var(--green);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--T)}
.badge.GAME_DAY .dot{background:var(--orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--orange);color:var(--ink);border:0;box-shadow:0 6px 16px rgba(255,130,0,.25)}
.btn.green{background:var(--green);color:#fff;border:0}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--danger)}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip.pain.on{background:var(--danger);border-color:var(--danger);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.5px;color:var(--green);display:flex;align-items:center;gap:4px}
.tile .k{font-size:11px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,#fff 55%,var(--orange-tint))}
.hero .swoosh{position:absolute;left:-30px;bottom:-34px;width:260px;opacity:.09;pointer-events:none}
.hero h2{color:var(--ink)}
.identity{font-size:15px;color:var(--ink-2);font-style:italic;margin-top:8px}
.banner{border-radius:14px;padding:14px;margin-bottom:14px;font-size:14px;border:1px solid var(--line);border-left:4px solid;background:#fff;position:relative;z-index:1}
.banner.warn{background:var(--orange-tint);border-left-color:var(--orange)}
.banner.bad{background:var(--danger-tint);border-left-color:var(--danger)}
.banner.info{background:var(--green-tint);border-left-color:var(--green)}
.banner b{display:block;margin-bottom:4px;font-size:15px;color:var(--ink)}
.check{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.check:last-child{border-bottom:0}
.check .t{width:64px;font-size:12px;color:var(--ink-2);font-weight:700;flex:none}
.check .lbl{flex:1}
.box{width:28px;height:28px;border-radius:50%;border:2px solid #cfd5cf;display:grid;place-items:center;flex:none;transition:all .15s}
.on>.box,.box.on{background:var(--orange);border-color:var(--orange)}
.box svg{width:15px;height:15px;opacity:0}
.on>.box svg,.box.on svg{opacity:1}
.check.on .lbl{color:var(--ink-2);text-decoration:line-through;text-decoration-color:#c9cfc9}
.pop{animation:pop .15s ease}
@keyframes pop{50%{transform:scale(1.22)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.day{border-radius:14px;padding:8px 2px;text-align:center;background:#fff;border:1.5px solid var(--line);min-height:74px;color:var(--ink)}
.day .d{font-size:11px;color:var(--ink-2);font-weight:700}
.day .n{font-size:18px;font-weight:800}
.day .ty{height:5px;border-radius:3px;margin:6px 8px 0}
.day .mk{height:14px;margin-top:3px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--green)}
.day.sel{border-color:var(--green);box-shadow:0 0 0 2px var(--green-tint)}
.day.today .n{color:var(--orange-ink)}
.ex{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:10px;border:1px solid var(--line)}
.ex .nm{font-weight:800;font-size:16px}
.ex .meta{font-size:13px;color:var(--ink-2)}
.sets{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.set{width:52px;height:52px;border-radius:50%;border:2px solid #cfd5cf;font-weight:800;display:grid;place-items:center;background:#fff;color:var(--ink);transition:all .15s}
.set.on{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.cues{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.list{margin:0;padding-left:18px}
.list li{margin:6px 0}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 120px)}
.hidden{display:none!important}
.sheet{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(13,18,16,.35)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px calc(var(--sb) + 24px);animation:up .25s ease;box-shadow:0 -10px 40px rgba(1,57,25,.12)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:#d5dad5;margin:0 auto 12px}
.sheet-title{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.sheet-title img{width:30px;height:30px;border-radius:8px}
.sheet-title h2{margin:0;font-size:22px;font-weight:800}
.restbar{position:fixed;left:16px;right:16px;bottom:calc(var(--sb) + 16px);z-index:55;background:var(--green);color:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:20px;box-shadow:0 10px 30px rgba(1,57,25,.35)}
#toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%) translateY(-140px);z-index:80;background:var(--green);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;transition:transform .3s;max-width:90vw;box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%) translateY(0)}
.ring{position:relative;width:110px;height:110px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:22px;line-height:1.1;color:var(--green)}
.ring .c small{display:block;font-size:11px;color:var(--ink-2);font-weight:700}
details{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;z-index:1}
details>summary{list-style:none;padding:16px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center;min-height:56px}
details>summary::-webkit-details-marker{display:none}
details>summary:after{content:"+";color:var(--orange-ink);font-size:22px}
details[open]>summary:after{content:"\2212"}
details .in{padding:0 16px 16px}
details details{box-shadow:none}
.recipe{border-top:1px solid var(--line);padding:14px 0}
.macros{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.macros span{font-size:12px;font-weight:700;background:var(--green-tint);color:var(--green);border-radius:8px;padding:4px 8px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 4px;border-bottom:1px solid var(--line);font-size:17px;font-weight:700;color:var(--ink)}
.menu button .mi{width:34px;height:34px;border-radius:10px;background:var(--green-tint);color:var(--green);display:grid;place-items:center;flex:none}
.menu button .mi svg{width:19px;height:19px}
.menu button .chev{margin-left:auto;color:var(--dim)}
label.f{display:block;font-size:13px;color:var(--ink-2);font-weight:700;margin:12px 0 6px}
.xpbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffb15c)}
.bdg{display:inline-flex;flex-direction:column;align-items:center;gap:6px;width:31%;padding:12px 4px;border-radius:14px;margin:0 1% 8px;text-align:center;font-size:12px;font-weight:800;color:var(--ink)}
.bdg .e{width:52px;height:52px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:var(--orange)}
.bdg .e svg{width:26px;height:26px}
.bdg.off{color:var(--dim)}
.bdg.off .e{background:#fff;border:2px dashed #d5dad5;color:#c3c9c3}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--green);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line)}
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.12em}
.empty{text-align:center;padding:18px 8px;color:var(--ink-2);font-size:14px}
.empty img{width:72px;height:72px;border-radius:18px;opacity:.12;display:block;margin:0 auto 10px}
.pill-r{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
.done-hero{position:relative;text-align:center;padding:18px 0 6px}
.done-hero:before{content:"";position:absolute;left:50%;top:6px;width:200px;height:200px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,130,0,.22),rgba(255,130,0,0) 65%)}
.done-hero img{position:relative;width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(1,57,25,.25)}
.done-hero h2{position:relative;font-size:26px;margin:14px 0 2px}
.ver{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:var(--dim);font-size:12px;font-weight:700}
.ver img{height:14px}
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;transition:opacity .45s}
#splash img{width:120px;height:120px;border-radius:28px;box-shadow:0 14px 40px rgba(1,57,25,.25);animation:splashIn .6s ease both}
#splash .wm{position:absolute;bottom:calc(var(--sb) + 60px);height:26px;animation:splashIn .6s .15s ease both}
@keyframes splashIn{from{opacity:0;transform:scale(.88)}}
#updateBar{position:fixed;left:12px;right:12px;top:calc(var(--st) + 10px);z-index:90;background:var(--green);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(1,57,25,.3)}
#updateBar img{width:34px;height:34px;border-radius:9px}
#updateBar .tx{flex:1;font-size:14px;line-height:1.25}
#updateBar .tx b{display:block;font-size:15px}
#updateBar button{background:var(--orange);color:var(--ink);font-weight:800;border-radius:11px;min-height:40px;padding:0 14px}
.wm-bg{position:fixed;right:-80px;bottom:calc(var(--sb) + 64px);width:380px;max-width:90vw;opacity:.07;z-index:0;pointer-events:none;user-select:none}
.signoff{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 0 6px;color:var(--dim);font-size:12px;font-weight:700;letter-spacing:.3px;position:relative;z-index:1}
.signoff img{width:22px;height:22px}
.card h2.brand{display:flex;align-items:center;gap:8px}
.card h2.brand:before{content:"";width:20px;height:20px;flex:none;background:url(gs-mark.png) center/contain no-repeat}
.wo-mark{width:30px;height:30px}
.hero-top{display:flex;align-items:center;gap:12px;margin-top:10px}
.hero-top img{width:52px;height:52px;border-radius:13px;box-shadow:0 6px 16px rgba(1,57,25,.22);flex:none}
.hero-top h2{margin:0!important}
.cover{position:relative;border-radius:8px 10px 10px 8px;padding:8px 7px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;flex:none;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),0 4px 10px rgba(1,57,25,.14);text-align:left}
.cover .ct{font-weight:900;line-height:1.08;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover .ca{font-size:9px;font-weight:700;opacity:.85;line-height:1.1}
.cover img{position:absolute;right:5px;bottom:5px;width:14px;height:14px;opacity:.9}
.cover .rib{position:absolute;top:6px;left:6px;background:var(--orange);color:var(--ink);font-size:8px;font-weight:900;padding:1px 5px;border-radius:4px;letter-spacing:.5px}
.cover.pk .ct{margin-top:14px}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.carousel .cv{scroll-snap-align:start;flex:none}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chiprow .chip{flex:none;white-space:nowrap;min-height:40px}
.bk{display:flex;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink);align-items:flex-start}
.bk:last-child{border-bottom:0}
.bi{flex:1;min-width:0}
.bt{font-weight:800;font-size:15px;line-height:1.2}
.ba{font-size:12px;color:var(--ink-2);margin-top:2px}
.bw{font-size:13px;color:var(--ink-2);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bp{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bp .cat{font-size:11px;font-weight:800;color:var(--green);background:var(--green-tint);border-radius:6px;padding:2px 7px}
.tg{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.tg.spice{color:#7a1f3d;background:#fbeef2;border-color:#f1d2dc}
.tg.comm{color:var(--green);background:var(--green-tint);border-color:#cfe2d5}
.tg.shelf{color:var(--orange-ink);background:var(--orange-tint);border-color:#ffd9b0}
.pbar{height:8px;border-radius:4px;background:var(--surface);overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;background:var(--orange)}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;color:#d5dad5;min-width:44px;min-height:44px}
.stars button.on{color:var(--orange)}
.sh3{margin:16px 0 8px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
a.btn{text-decoration:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--ink);font-weight:700}
.toggle .sw{width:50px;height:30px;border-radius:15px;background:#d5dad5;position:relative;flex:none;transition:background .2s}
.toggle .sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle.on .sw{background:var(--green)}
.toggle.on .sw:after{left:23px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const pad = n => String(n).padStart(2, "0");

const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

const toMin = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fromMin = m => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ":" + pad(((m % 60) + 60) % 60);
const fmtT = t => { if (!t || t.indexOf(":") < 0) return t || ""; let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + ":" + pad(m) + " " + ap; };

/* ---------------------------- ENGINE: day types ----------------------------

   > LEG_DAY / FLEX (resolved per week: no back-to-back legs except Fri+Sat, max 3). */
let weekCache = {};
function invalidate() { weekCache = {}; }
function courtOn(s) {
  const ev = [];

  if (dow(s) === S.practice.weekday && !S.practiceSkips.includes(s))
    ev.push({ type: "practice", date: s, start: S.practice.start, end: S.practice.end, label: "Practice", gym: S.practice.location });

}
function baseType(s) {

  if (c.length) return "PRACTICE_DAY";

  if (courtOn(addDays(s, 1)).length) return "PRE_COURT";
  return null;
}
function resolveWeek(ws) {
  if (weekCache[ws]) return weekCache[ws];
  const out = {}; let prev = "RECOVERY", prev2 = null, legs = 0, letter = 0;
  for (let i = 0; i < 7; i++) {
    const s = addDays(ws, i); let t = baseType(s); const info = { date: s, type: t };
    if (!t) {
      const sat = dow(s) === 6;
      if (legs < 3 && (prev !== "LEG_DAY" || (sat && prev2 !== "LEG_DAY"))) { t = "LEG_DAY"; legs++; info.leg = letter++ % 2 ? "B" : "A"; }
      else t = "FLEX";
      info.type = t;
      if (t === "LEG_DAY") info.moderate = dow(s) === 3 || courtOn(addDays(s, 2)).length > 0;
    }
    if (t === "PRE_COURT") info.preFor = courtOn(addDays(s, 1)).some(e => e.type === "game") ? "game" : "practice";

  for (const s in out) if (S.midDay[s] !== undefined) out[s].midday = S.midDay[s];

  if (wk === 4) return { wk, label: "Week 4: Build + Check-in", sets: 3, rpe: "6 to 7", calf: "ecc", agil: 2, note: "Small bump. 4-week check-in on Sunday." };

const isCourt = s => courtOn(s).length > 0;
const waterGoal = s => S.profile.waterBase + (isCourt(s) ? S.profile.waterCourtExtra : 0);
function isActive(s) { const l = S.logs[s]; return !!(l && (l.done || l.mvdDone || l.checks.court)); }
function streak() {
  let s = todayStr(); if (!isActive(s)) s = addDays(s, -1);
  let n = 0, grace = {}; const first = Object.keys(S.logs).sort()[0];
  if (!first) return 0;
  for (let i = 0; i < 1000 && s >= first; i++) {
    if (isActive(s)) n++;

}
function xp() {
  let x = 0;
  for (const s in S.logs) { const l = S.logs[s]; x += Object.values(l.checks).filter(Boolean).length * 5 + (l.done ? 50 : 0) + (l.mvdDone ? 25 : 0) + (l.reading > 0 ? 10 : 0) + (l.sleep ? 10 : 0); }
  return x;
}
function checkBadges() {
  const logs = Object.entries(S.logs), have = new Set(S.meta.badges), add = id => { if (!have.has(id)) { have.add(id); toast("Badge unlocked: " + BADGES.find(b => b[0] === id)[2]); } };
  const active = logs.filter(([s]) => isActive(s)).length;
  if (active >= 7) add("week1");
  if (streak() >= 7) add("streak7");
  if (logs.filter(([s, l]) => l.water >= waterGoal(s)).length >= 7) add("hydro");
  if (logs.filter(([, l]) => l.calf).length >= 20) add("calf");
  if (logs.filter(([, l]) => l.reading > 0).length >= 10) add("book");
  if (logs.some(([s, l]) => getDayType(s) === "GAME_DAY" && l.checks.electro && (l.done || l.mvdDone))) add("game");
  if (logs.filter(([, l]) => l.sleep && l.sleep.bed && toMin(l.sleep.bed) <= 22 * 60 && toMin(l.sleep.bed) > 12 * 60).length >= 7) add("sleep");
  const fin = Object.values((S.reads || {}).shelf || {}).filter(v => v === "done").length;
  if (fin >= 1) add("finish1");
  if (fin >= 5) add("shelf5");
  if (((S.reads || {}).myRecs || []).some(m => !m.pending)) add("scout");
  S.meta.badges = [...have];
}
const BADGES = [["week1", "flag", "First Week"], ["streak7", "fire", "7-Day Streak"], ["hydro", "drop", "Hydration Hero"], ["calf", "shield", "Calf Armor"], ["book", "book", "Bookworm"], ["game", "hoop", "Game Ready"], ["sleep", "moon", "Sleep Pro"], ["finish1", "book", "First Finish"], ["shelf5", "book", "Shelf Builder"], ["scout", "flag", "Scout"]];
function sleepHrs(sl) { if (!sl || !sl.bed || !sl.wake) return null; let d = toMin(sl.wake) - toMin(sl.bed); if (d <= 0) d += 1440; return d / 60; }

  const h = arr.map(sleepHrs).filter(x => x != null), q = arr.map(x => +x.q).filter(Boolean);

}
function nextCourt() {

  for (let i = 0; i < 120; i++) { const s = addDays(t, i); for (const e of courtOn(s)) if (at(s, e.end) > now) return Object.assign({ at: at(s, e.start) }, e); }

}
function countdown(d) { const ms = d - new Date(); if (ms <= 0) return "Now"; const m = Math.floor(ms / 6e4), h = Math.floor(m / 60), dd = Math.floor(h / 24); return dd ? dd + "d " + (h % 24) + "h" : h ? h + "h " + (m % 60) + "m" : m + "m"; }

}

/* ---------------------------- PROGRESS ---------------------------- */
function chart(field, unit, color) {
  const pts = S.body.filter(b => b[field]).sort((a, b) => a.date < b.date ? -1 : 1);
  if (pts.length < 2) return emptyState("Log 2+ entries to see your trend.");
  const vals = pts.map(p => +p[field]), mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1, W = 320, H = 120;
  const xy = pts.map((p, i) => [10 + i * (W - 20) / (pts.length - 1), 10 + (H - 30) * (1 - (p[field] - mn) / rg)]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${[0, 1, 2].map(i => `<line x1="0" x2="${W}" y1="${10 + i * (H - 30) / 2}" y2="${10 + i * (H - 30) / 2}" stroke="#e6e9e4"/>`).join("")}<polyline fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" points="${xy.map(p => p.join(",")).join(" ")}"/>${xy.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === xy.length - 1 ? 6 : 3.5}" fill="${i === xy.length - 1 ? "#ff8200" : color}"/>`).join("")}<text x="10" y="${H - 4}" fill="#55605a" font-size="11">${fmtShort(pts[0].date)}: ${vals[0]} ${unit}</text><text x="${W - 10}" y="${H - 4}" fill="#55605a" font-size="11" text-anchor="end">${fmtShort(pts[pts.length - 1].date)}: ${vals[vals.length - 1]} ${unit}</text></svg>`;
}

  const rd = R(), sh = shelfOf(id), rate = (rd.rating || {})[id] || 0;
  const L = b.links || qlink(b.title, b.author);
  const lk = (u, t) => u ? `<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : "";
  return `<div class="row" style="gap:14px;align-items:flex-start">${coverHTML(b, 92)}<div style="flex:1"><div class="eyebrow">${esc(catName(b.category))}</div><h2 style="margin:4px 0 2px;font-size:22px;line-height:1.15">${esc(b.title)}</h2><div class="muted">${esc(b.author)}${b.year ? " • " + esc(b.year) : ""}</div>${b.series ? `<div class="small" style="margin-top:4px;color:var(--orange-ink);font-weight:700">${esc(b.series)}, book ${b.seriesOrder}</div>` : ""}${b.source === "community" ? `<div class="small" style="margin-top:4px;color:var(--green);font-weight:700">Community pick${b.by ? " from " + esc(b.by) : ""}</div>` : ""}</div></div>
  <p style="margin:14px 0 6px">${esc(b.why)}</p>${b.readIf ? `<p class="small muted" style="margin:0 0 10px">${esc(b.readIf)}</p>` : ""}
  <div class="bp" style="margin-bottom:12px">${(b.tags || []).map(t => `<span class="tg">${esc(t)}</span>`).join("")}${b.category === "romance" ? `<span class="tg spice">Spice ${b.spice}/3</span>` : ""}${b.similarTo ? `<span class="tg shelf">Like ${esc(b.similarTo)}</span>` : ""}</div>
  <div class="grid2">${lk(L.amazon, "Amazon")}${lk(L.bookshop, "Bookshop")}${lk(L.goodreads, "Reviews (Goodreads)")}${lk(L.audible, "Audible")}${lk(L.link, "Their link")}</div>
  <h3 class="sh3">My shelf</h3><div class="seg">${[["want", "Want to read"], ["reading", "Reading"], ["done", "Finished"]].map(s => `<button class="${sh === s[0] ? "on" : ""}" data-act="setShelf" data-id="${id}" data-v="${s[0]}">${s[1]}</button>`).join("")}</div>
  <h3 class="sh3">My rating</h3><div class="stars">${[1, 2, 3, 4, 5].map(n => `<button class="${n <= rate ? "on" : ""}" data-act="rateBook" data-id="${id}" data-v="${n}">★</button>`).join("")}</div>
  <h3 class="sh3">Private notes</h3><textarea data-in="bookNote" data-id="${id}" placeholder="Takeaways, quotes in your own words, what to apply">${esc((rd.notes || {})[id] || "")}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn sm" style="flex:1" data-act="hideBook" data-id="${id}">Hide from my list</button>${rd.adminPin && b.source === "community" ? `<button class="btn sm" style="flex:1" data-act="adminBook" data-id="${b.cid}" data-v="${b.hidden ? "unhide" : "hide"}">${b.hidden ? "Unhide" : "Hide for all"}</button><button class="btn sm" style="flex:1" data-act="adminBook" data-id="${b.cid}" data-v="promote">Make Brett's Pick</button>` : ""}</div>`;
}
function recommendSheet() {
  return `${sheetTitle("Recommend a book")}<div class="small muted">It goes live for the whole crew${R().backend ? "" : " once sharing is set up"}.</div>
  <label class="f">Title *</label><input id="rcT" maxlength="120"><label class="f">Author *</label><input id="rcA" maxlength="80">
  <label class="f">Category</label><select id="rcC">${Object.entries(BOOKDATA.categories || {}).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select>
  <label class="f">Why should someone read it?</label><textarea id="rcW" maxlength="280" placeholder="One or two lines"></textarea>
  <label class="f">Link (optional)</label><input id="rcL" type="url" placeholder="https://" maxlength="300">
  <button class="btn primary block" style="margin-top:14px" data-act="sendRec">Share with the crew</button>`;
}
async function sendRec() {
  const v = id => (document.getElementById(id).value || "").trim();
  const rec = { title: v("rcT"), author: v("rcA"), category: v("rcC"), why: v("rcW"), link: v("rcL"), recommendedBy: S.profile.name || "Friend", device: deviceId() };
  if (!rec.title || !rec.author) return toast("Title and author please");
  if (rec.link && !/^https?:\/\//i.test(rec.link)) return toast("Link must start with https://");
  try {
    const r = await fetch(READS_API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rec) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "fail");
    R().myRecs = (R().myRecs || []).concat([Object.assign({ id: (await r.clone().json().catch(() => ({}))).id || "m" + Date.now(), date: todayStr() }, rec)]);
    save(); await syncCommunity(); checkBadges();
    openSheet("result", `<div class="done-hero"><img src="icon-512.png" alt=""><h2>Thanks, it's live for the crew</h2><div class="muted">${esc(rec.title)} by ${esc(rec.author)}</div></div><button class="btn primary block" style="margin-top:14px" data-act="closeSheet">Done</button>`);
  } catch (e) {
    R().myRecs = (R().myRecs || []).concat([Object.assign({ id: "m" + Date.now(), date: todayStr(), pending: true }, rec)]); save();
    const body = encodeURIComponent("Book rec for Game Shape: " + rec.title + " by " + rec.author + (rec.why ? ". " + rec.why : ""));
    openSheet("result", `<div class="done-hero"><img src="icon-512.png" alt=""><h2>Saved on your phone</h2><div class="muted">${String(e.message || "").length > 4 && e.message !== "fail" ? esc(e.message) : "The shared list is not connected yet."}</div></div><a class="btn green block" href="sms:&body=${body}">Text it to Brett instead</a><button class="btn block" style="margin-top:10px" data-act="closeSheet">Done</button>`);
  }
  render();
}
function deviceId() { try { let d = localStorage.getItem("gs_device"); if (!d) { d = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("gs_device", d); } return d; } catch (e) { return "anon"; } }
function logReading(min) {
  const rd = R(), l = L(todayStr()); l.reading += min; l.checks.wd_read = true;
  if (rd.current) { rd.minutes = rd.minutes || {}; rd.minutes[rd.current] = (rd.minutes[rd.current] || 0) + min; }
  save(); buzz(); checkBadges();
}
Object.assign(ACT, {
  book: el => openSheet("book", el.dataset.id),
  rchip: el => { RUI.chip = el.dataset.v; RUI.limit = 30; document.querySelectorAll('[data-act="rchip"]').forEach(b => b.classList.toggle("on", b === el)); renderReadList(); },
  rshelf: el => { RUI.shelf = el.dataset.v; RUI.limit = 30; document.querySelectorAll('[data-act="rshelf"]').forEach(b => b.classList.toggle("on", b === el)); renderReadList(); },
  moreBooks: () => { RUI.limit += 30; renderReadList(); },
  setShelf: el => { const rd = R(), id = el.dataset.id, v = el.dataset.v; rd.shelf = rd.shelf || {}; rd.shelf[id] = rd.shelf[id] === v ? "" : v; if (rd.shelf[id] === "reading") rd.current = id; if (rd.shelf[id] === "done") { rd.progress = rd.progress || {}; rd.progress[id] = 100; if (rd.current === id) rd.current = null; toast("Finished. Nice work."); } save(); checkBadges(); renderSheet(); render(); },
  rateBook: el => { const rd = R(); rd.rating = rd.rating || {}; rd.rating[el.dataset.id] = +el.dataset.v; save(); renderSheet(); },
  hideBook: el => { const rd = R(); rd.hidden = (rd.hidden || []).concat([el.dataset.id]); save(); closeSheet(); render(); toast("Hidden. Undo in Settings."); },
  readMin: el => { logReading(+el.dataset.v); toast("+" + el.dataset.v + " min logged"); render(); },
  readPct: el => { const rd = R(); rd.progress = rd.progress || {}; rd.progress[rd.current] = Math.min(100, (rd.progress[rd.current] || 0) + +el.dataset.v); save(); render(); },
  finishBook: () => { const rd = R(), id = rd.current; if (!id) return; rd.shelf[id] = "done"; rd.progress = rd.progress || {}; rd.progress[id] = 100; rd.current = null; save(); checkBadges(); openSheet("book", id); toast("Finished. Rate it while it's fresh."); render(); },
  sendRec: () => sendRec(),
  spicy: () => { R().spicy = !R().spicy; save(); renderSheet(); render(); },
  unhideAll: () => { R().hidden = []; save(); toast("All books visible again"); render(); },
  adminUnlock: () => { const p = (document.getElementById("adPin").value || "").trim(); if (!p) return; R().adminPin = p; save(); syncCommunity().then(() => toast(R().backend ? "Admin mode on" : "Saved. Works once sharing is live.")); renderSheet(); },
  adminLock: () => { R().adminPin = ""; save(); renderSheet(); syncCommunity(); },
  adminBook: async el => { try { const r = await fetch(READS_ADMIN, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: R().adminPin, id: el.dataset.id, action: el.dataset.v }) }); if (!r.ok) throw 0; toast("Updated for everyone"); await syncCommunity(); closeSheet(); render(); } catch (e) { toast("Admin action failed. Check your PIN."); } }
});
document.addEventListener("input", e => { if (e.target.id === "readSearch") { RUI.q = e.target.value; RUI.limit = 30; renderReadList(); } });

/* ---------------------------- UPDATES: auto-update, update bar, What's new ----------------------------
   Release steps: bump APP_VERSION + CHANGELOG here, "version" in version.json, and VERSION in sw.js. Deploy.
   Data lives in localStorage under the same key, so updates never touch anyone's logs. */
const cmpVer = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
function whatsNewHTML() {
  return sheetTitle("What's new") + Object.keys(CHANGELOG).sort((a, b) => cmpVer(b, a)).map(v => `<div class="card"><div class="eyebrow">Version ${v}</div><ul class="list">${CHANGELOG[v].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("") + `<div class="small muted">Updates install on their own. Your workouts, logs, and settings stay saved on your phone.</div>`;
}
function showWhatsNew() {
  const seen = S.meta.seenVersion; if (seen === APP_VERSION) return;
  S.meta.seenVersion = APP_VERSION; save();
  if (!seen && !Object.keys(S.logs).length) return;   // brand new user: nothing to announce
  openSheet("result", `<div class="done-hero"><img src="icon-512.png" alt=""><h2>Updated to v${APP_VERSION}</h2><div class="muted">All your data is still here.</div></div><ul class="list">${(CHANGELOG[APP_VERSION] || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul><button class="btn primary block" style="margin-top:14px" data-act="closeSheet">Let's go</button>`);
}
async function applyUpdate() {
  save();
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) for (const r of await navigator.serviceWorker.getRegistrations()) { await r.update(); if (r.waiting) r.waiting.postMessage("SKIP_WAITING"); }
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch (e) {}
  location.reload();
}
async function checkUpdate(auto) {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
    const v = await r.json(); if (!v.version || cmpVer(v.version, APP_VERSION) <= 0) return;
    let tried = null; try { tried = sessionStorage.getItem("gs_upd_try"); } catch (e) {}
    if (auto && tried !== v.version) { try { sessionStorage.setItem("gs_upd_try", v.version); } catch (e) {} return applyUpdate(); }
    const b = $("updateBar");
    b.innerHTML = `<img src="icon-180.png" alt=""><div class="tx"><b>Update ready: v${esc(v.version)}</b>${esc((v.notes || [])[0] || "New features and fixes")}</div><button data-act="doUpdate">Update</button>`;
    b.classList.remove("hidden");
  } catch (e) {}
}
ACT.doUpdate = () => applyUpdate();
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("controllerchange", () => { if (!window.__gsReloaded) { window.__gsReloaded = true; location.reload(); } });
setInterval(() => checkUpdate(false), 30 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(false); });

/* Daily splash: GS icon on white, first open of the day only. */
(function splash() {
  let day = null; try { day = localStorage.getItem("gs_splash_day"); localStorage.setItem("gs_splash_day", todayStr()); } catch (e) { return; }
  if (day === todayStr()) return;
  const sp = $("splash"); sp.classList.remove("hidden");
  setTimeout(() => { sp.style.opacity = "0"; setTimeout(() => sp.classList.add("hidden"), 450); }, 950);
})();
render();
showWhatsNew();
checkUpdate(true);
loadBooks();
syncCommunity();
</script>
</body>
</html>
