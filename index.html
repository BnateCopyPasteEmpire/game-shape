/* ===================== BRAND (shared tokens for every Game Shape app + intake) ===================== */
:root{
  --bg:#ffffff; --surface:#f7f8f6; --line:#e6e9e4; --ink:#0d1210; --ink-2:#55605a; --dim:#9aa39e;
  --green:#013919; --green-2:#0e5a2e; --green-tint:#e8f1eb; --orange:#ff8200; --orange-rgb:255,130,0; --orange-ink:#b85c00; --orange-tint:#fff1e2; --danger:#c62828; --danger-tint:#fdecec;
  /* legacy aliases used by the engine's templates */
  --card:#ffffff; --card2:var(--surface); --text:var(--ink); --muted:var(--ink-2); --accent:var(--orange); --accent2:var(--green); --warn:var(--orange-ink); --bad:var(--danger);
  --LEG_DAY:#ff8200; --PRE_COURT:#0e5a2e; --GAME_DAY:#013919; --PRACTICE_DAY:#2f7a4f; --RECOVERY:#6ba37e; --FLEX:#d9a21b;
  --shadow:0 1px 2px rgba(1,57,25,.04),0 8px 24px rgba(1,57,25,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overscroll-behavior-y:none}
body{min-height:100vh;overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:48px}
textarea{min-height:90px;resize:vertical}
input[type=range]{accent-color:var(--danger);min-height:40px;border:0;background:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0}
.top{position:sticky;top:0;z-index:20;display:block;padding:calc(var(--st) + 14px) 18px 12px;background:linear-gradient(#fff 78%,rgba(255,255,255,0))}
.brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.brandrow>img{height:22px;display:block;margin-top:2px}
.cpe{text-align:right;line-height:1.15}
.cpe-mark{font-size:10.5px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--green);white-space:nowrap}
.cpe-mark i{display:inline-block;width:6px;height:6px;border-radius:1.5px;background:var(--orange);margin-right:5px;vertical-align:1px}
.cpe-mark sup{font-size:7px;letter-spacing:0;margin-left:1px;vertical-align:5px}
.cpe-logo{height:30px;width:auto;display:block;margin-left:auto;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.cpe-date{font-size:11px;font-weight:700;color:var(--ink-2);margin-top:3px;white-space:nowrap}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;width:100%}
.top h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;color:var(--ink)}
.eyebrow{color:var(--ink-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.iconbtn{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--green)}
main{position:relative;padding:0 16px calc(var(--sb) + 100px);max-width:640px;margin:0 auto}
main>*{position:relative;z-index:1}
.art{position:absolute!important;z-index:0!important;pointer-events:none}
.art svg{display:block;width:100%;height:auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:8px 6px calc(var(--sb) + 6px);background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;font-size:10px;min-width:0;font-weight:700;color:var(--dim);position:relative}
.tabbar button.on{color:var(--green)}
.tabbar button.on:after{content:"";position:absolute;bottom:-2px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.tabbar svg{width:24px;height:24px}
.card{background:#fff;border-radius:20px;padding:16px;margin:0 0 14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:19px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.card h3{margin:16px 0 8px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-2)} .small{font-size:13px} .big{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--green)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--T) 14%,#fff);border:1px solid color-mix(in srgb,var(--T) 30%,#fff)}
.badge.GAME_DAY{border:1.5px solid var(--orange);background:var(--green);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:var(--T)}
.badge.GAME_DAY .dot{background:var(--orange)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;font-weight:800;background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--orange);color:var(--ink);border:0;box-shadow:0 6px 16px rgba(var(--orange-rgb),.25)}
.btn.green{background:var(--green);color:#fff;border:0}
.btn.block{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.danger{color:var(--danger)}
.chip{min-height:44px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.sl-big{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 12px}.sl-big b{font-size:30px;letter-spacing:-.5px}
.sl-strip{display:flex;gap:6px;align-items:flex-end;margin-top:16px;padding-top:10px;border-top:1px solid var(--line)}
.sl-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-height:104px;padding:4px 0;border-radius:10px;background:none;border:1px solid transparent;color:var(--ink)}
.sl-bar i{display:block;width:70%;max-width:30px;border-radius:6px}.sl-bar small{font-size:11px;font-weight:800;min-height:14px}.sl-bar span{font-size:11px;font-weight:700;color:var(--ink-2)}
.sl-bar.on{border-color:var(--line);background:var(--surface)}
.rt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rt-btn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:64px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--ink)}
.rt-btn b{font-size:14px}.rt-btn small{font-size:12px;color:var(--ink-2)}
.st-item{padding:14px 0;border-bottom:1px solid var(--line)}.st-item:last-child{border-bottom:0}
ol.st-cues{margin:0;padding-left:20px;font-size:14px}ol.st-cues li{margin:3px 0}
.rt-clock{font-size:64px;font-weight:900;text-align:center;letter-spacing:-2px;margin:14px 0 0;font-variant-numeric:tabular-nums}
.rt-side{text-align:center;font-weight:800;color:var(--orange-ink);min-height:20px}
.rt-track{height:8px;border-radius:8px;background:var(--surface);overflow:hidden;margin-top:8px}.rt-track i{display:block;height:100%;background:var(--green);transition:width .9s linear}
details.tip{box-shadow:none;margin-bottom:8px}details.tip>summary{font-size:15px;min-height:48px;padding:12px 14px}
.chip.pain:not(.on){border-color:var(--danger);color:var(--danger)}
#affCard>summary{padding:16px}
.st-item .howto,#sheetBody .howto{min-height:44px}#stretchCard .chiprow .chip{min-height:44px}#windCard .btn.sm,#affCard .btn.sm,#sleepCard .btn.sm{min-height:44px}
/* v3.1.1 tap splash: teal core, purple ring */
.tapfx{position:fixed;border-radius:50%;pointer-events:none;z-index:140;transform:translate(-50%,-50%) scale(.15);opacity:.5;background:radial-gradient(circle,rgba(255,255,255,.85) 0 7%,rgba(var(--epc-teal-rgb),.7) 8% 30%,rgba(var(--epc-purple-rgb),.45) 31% 52%,rgba(var(--epc-purple-rgb),0) 70%);animation:tapfx2 .5s cubic-bezier(.15,.8,.3,1) forwards}
.tapfx.soft{background:radial-gradient(circle,rgba(var(--epc-teal-rgb),.35) 0 30%,rgba(var(--epc-purple-rgb),.18) 31% 55%,rgba(var(--epc-purple-rgb),0) 70%);animation-duration:.45s}
.tapring{position:fixed;border-radius:50%;pointer-events:none;z-index:140;transform:translate(-50%,-50%) scale(.3);opacity:.55;border:2px solid rgba(var(--epc-purple-rgb),.6);box-shadow:0 0 8px rgba(var(--epc-teal-rgb),.45),inset 0 0 6px rgba(var(--epc-teal-rgb),.3);animation:tapring2 .5s ease-out forwards}
@keyframes tapfx2{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes tapring2{to{transform:translate(-50%,-50%) scale(1.3);opacity:0;border-width:1px}}
summary:active,.check:active,.fcard:active,.pb-tile:active,.rt-btn:active,.sl-bar:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.tapfx,.tapring{display:none}}
/* v3.1.1 Fuel */
.fuel-rings{display:flex;justify-content:space-around;margin:8px 0 4px}
.ring.bump{animation:ringBump .45s cubic-bezier(.2,1.6,.4,1)}@keyframes ringBump{40%{transform:scale(1.08)}}
.ring circle{transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)!important}
.fuel-pt{margin:6px 0 10px;font-size:13px;font-weight:700;color:var(--ink-2)}.fuel-pt>i{display:block;height:8px;border-radius:8px;background:var(--surface);overflow:hidden;margin-top:5px}.fuel-pt>i>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--epc-teal),var(--epc-purple));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fuel-pt.hit{color:var(--green)}
.fq-row{display:flex;align-items:center;gap:6px;margin-top:8px}.fq-row .chip{flex:1;min-height:44px;padding:0 6px;font-size:14px}.fq-row .chip:disabled{opacity:.4}
.fq-k{width:58px;flex:none;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2)}
.fuel-cats{position:sticky;top:0;z-index:15;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -12px 12px;padding:calc(var(--st,0px) + 8px) 12px 8px;background:linear-gradient(var(--bg) 82%,rgba(255,255,255,0));-webkit-overflow-scrolling:touch}
.fuel-cats::-webkit-scrollbar,.fcar::-webkit-scrollbar{display:none}
.fuel-cats .chip{flex:none;white-space:nowrap;min-height:44px;gap:6px;display:inline-flex;align-items:center;transition:background .25s,color .25s,transform .15s,box-shadow .25s}
.fuel-cats .chip.on{background:linear-gradient(135deg,var(--epc-purple),#2f1b50);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(var(--epc-purple-rgb),.35),0 0 0 2px rgba(var(--epc-teal-rgb),.5)}
.fc-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--epc-teal);color:#fff;font-size:11px}
.fuel-search{padding:10px 12px}.fuel-search input{width:100%;min-height:46px}
.fsec{margin-bottom:18px;border-radius:18px}.fsec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 2px 8px}.fsec-h h2{margin:0;font-size:19px}.fsec-h .small{text-align:right}
.fsec.flash{animation:secFlash .9s ease}@keyframes secFlash{25%{box-shadow:0 0 0 3px rgba(var(--epc-teal-rgb),.55)}}
.fcar{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scroll-padding:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fcard{flex:0 0 76%;max-width:300px;scroll-snap-align:start;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.fsec.rv .fcard{opacity:0;transform:translateX(24px)}.fsec.rv.in .fcard{opacity:1;transform:none;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.fsec.rv.in .fcard:nth-child(2){transition-delay:.06s}.fsec.rv.in .fcard:nth-child(3){transition-delay:.12s}
.fc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.fc-top b{font-size:15px;line-height:1.25}
.fc-p{flex:none;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--epc-teal),var(--epc-purple));border-radius:999px;padding:3px 9px}
.fc-d{font-size:13px;color:var(--ink-2);line-height:1.4;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.fc-ate,.fc-rec{min-height:44px!important;width:100%}
.fc-mac{display:flex;flex-wrap:wrap;gap:5px}.fc-mac span{font-size:11px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.fc-step{display:flex;align-items:center;gap:8px}.fc-step .btn{min-width:44px;min-height:44px!important;padding:0;font-size:20px}.fc-step span{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--ink-2)}.fc-step span.on{color:var(--green)}
.pb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pb-tile{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;color:var(--ink)}.pb-tile span{font-size:22px}.pb-tile b{font-size:13px;line-height:1.25}
.pb-list li{margin:8px 0;font-size:15px}
.drink{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}.drink:last-child{border-bottom:0}
.fgroc .btn.sm{min-height:44px}
/* v3.1.3 Reads: swipe between up to 4 books you're reading */
.rd-car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px;scroll-padding:0 16px;overscroll-behavior-x:contain}
.rd-car::-webkit-scrollbar{display:none}
.rd-car>.card{flex:0 0 100%;scroll-snap-align:center;margin:0}
.rd-car .btn.sm{min-height:44px}
.rd-car.solo{overflow:visible;margin:0 0 14px;padding:0}
.rd-dots{display:flex;justify-content:center;gap:7px;margin:-6px 0 14px}
.rd-dots i{width:7px;height:7px;border-radius:7px;background:#d5dad5;transition:all .25s}
.rd-dots i.on{width:20px;background:linear-gradient(90deg,var(--epc-teal),var(--epc-purple))}
.rd-n{float:right;font-size:12px;font-weight:800;color:var(--epc-purple)}
@media (max-width:400px){.rd-car{margin:0 -12px 12px;padding:0 12px;scroll-padding:0 12px}}
/* v3.1.3 Walmart cart: one button under the grocery list, a review sheet, one add-to-cart link */
.wm-send{margin-top:14px;min-height:52px;font-weight:800;font-size:15px;color:#fff;border:0;background:linear-gradient(135deg,var(--epc-teal),var(--epc-purple));box-shadow:0 6px 18px rgba(var(--epc-purple-rgb),.28);display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.wm-send.sent{background:#fff;color:var(--epc-purple);border:1.5px solid rgba(var(--epc-purple-rgb),.35);box-shadow:none}
.wm-send .wm-ic{font-size:18px}
.wm-intro{font-size:13px;color:var(--ink-2);margin:-4px 0 10px}
.wm-cat{color:var(--muted);font-size:13px;text-transform:uppercase;margin:16px 0 2px;display:flex;justify-content:space-between}
.wm-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.wm-row:last-child{border-bottom:0}
.wm-row .check{border-bottom:0;flex:1;min-width:0;padding:10px 0}
.wm-row .check .lbl{min-width:0}
.wm-row .check.on .lbl{color:var(--ink);text-decoration:none}
.wm-row .check:not(.on) .lbl{color:var(--ink-2);text-decoration:line-through;text-decoration-color:#c9cfc9}
.wm-row .on>.box{background:linear-gradient(135deg,var(--epc-teal),var(--epc-purple));border-color:transparent}
.wm-row .box svg path{stroke:#fff}
.wm-row .check.on>.box.anim{animation:wmChk .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes wmChk{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.wm-n{display:block;font-weight:700;line-height:1.25}
.wm-s{display:block;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.3}
.wm-tag{font-size:10.5px;font-weight:800;color:var(--epc-purple);background:rgba(var(--epc-purple-rgb),.09);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.wm-q{display:flex;align-items:center;gap:2px;flex:none;transition:opacity .2s}
.wm-q button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:800;color:var(--ink);display:grid;place-items:center}
.wm-q b{min-width:22px;text-align:center}
.wm-row .check:not(.on)~.wm-q{opacity:.3;pointer-events:none}
.wm-find{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wm-find:last-child{border-bottom:0}
.wm-find>div{flex:1;min-width:0}
.wm-find .btn{min-height:44px;flex:none;display:inline-flex;align-items:center;text-decoration:none}
.wm-foot{position:sticky;bottom:calc(-1 * (var(--sb) + 24px));margin:14px -16px calc(-1 * (var(--sb) + 24px));padding:12px 16px calc(var(--sb) + 16px);background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -10px 20px -14px rgba(0,0,0,.25);z-index:2}

@keyframes gsFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes gsBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.tabbar button{isolation:isolate}
.tabbar button svg{stroke:url(#gsTabGrad);opacity:.8;animation:gsBreathe 3.2s ease-in-out infinite;transform-origin:center}
.tabbar button:nth-child(3) svg{animation-delay:.25s}.tabbar button:nth-child(4) svg{animation-delay:.5s}.tabbar button:nth-child(5) svg{animation-delay:.75s}.tabbar button:nth-child(6) svg{animation-delay:1s}.tabbar button:nth-child(7) svg{animation-delay:1.25s}
.tabbar .tl{background:linear-gradient(90deg,#0f7a3f,var(--orange),#0f7a3f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gsFlow 4s ease-in-out infinite;opacity:.8;font-weight:800}
.tabbar button.on svg{opacity:1;stroke-width:2.5}
.tabbar button.on .tl{opacity:1;font-weight:900}
.tabbar button.on:before{content:"";position:absolute;inset:2px 8px 10px;border-radius:16px;z-index:-1;background:linear-gradient(120deg,rgba(1,57,25,.16),rgba(var(--orange-rgb),.26),rgba(1,57,25,.16));background-size:200% 200%;animation:gsFlow 4s ease-in-out infinite,gsGlow 3.2s ease-in-out infinite;box-shadow:0 0 16px rgba(var(--orange-rgb),.25)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html{overflow-x:clip}
body{touch-action:pan-y pinch-zoom}
main{padding:0 12px calc(var(--sb) + 100px);overflow-x:clip}
header.top{position:relative}   /* v3.1.1: header scrolls away like before; only the Fuel category bar sticks */
.top{padding:calc(var(--st) + 12px) 14px 10px}
.card{padding:14px;margin:0 0 12px;border-radius:18px}
.grid3,.grid2{gap:8px}
img,svg,video{max-width:100%}
/* tap glow in each person's color */
.btn,.chip,.iconbtn,.tile,.menu button,.sbrow,.tabbar button,a.btn,[data-act]{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,box-shadow .25s ease,background-color .2s ease}
.btn:active,.chip:active,.iconbtn:active,.menu button:active,a.btn:active,.tile:active{transform:scale(.97);box-shadow:0 0 0 4px rgba(var(--orange-rgb),.22),0 6px 18px rgba(var(--orange-rgb),.28)}
.tabbar button:active{transform:scale(.94)}
@keyframes tapfx{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* scroll reveal */
.rv{opacity:0;transform:translateY(14px) scale(.99);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
/* subtle sports art layer */
#sportsArt{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sportsArt svg{position:absolute;opacity:.045;will-change:transform}
/* profile badge with slow color shine */
.pbadge{position:relative;display:block;width:132px;height:132px;margin:4px auto 10px;border-radius:26%;overflow:hidden;box-shadow:0 10px 30px rgba(var(--orange-rgb),.28),0 2px 6px rgba(0,0,0,.25);animation:pbHue 14s ease-in-out infinite}
.pbadge img{width:100%;height:100%;display:block}
.pbadge:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.38) 50%,rgba(255,255,255,0) 60%);transform:translateX(-60%);animation:pbShine 6s ease-in-out infinite}
.pbadge.big{width:min(72vw,300px);height:min(72vw,300px)}
@keyframes pbHue{0%,100%{filter:hue-rotate(0deg) saturate(1) brightness(1)}50%{filter:hue-rotate(-14deg) saturate(1.15) brightness(1.06)}}
@keyframes pbShine{0%,55%{transform:translateX(-60%)}85%,100%{transform:translateX(60%)}}
/* welcome surprise */
.welcome{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 32%,rgba(var(--orange-rgb),.32),rgba(1,57,25,0) 58%),linear-gradient(160deg,#013919,#00230f);color:#fff;animation:wIn .5s ease}
.welcome h2{margin:6px 0 4px;font-size:26px;letter-spacing:-.4px}
.welcome p{margin:4px 0;opacity:.9}
.welcome .btn{margin-top:18px;min-width:220px}
.welcome .pbadge{animation:pbHue 14s ease-in-out infinite,wPop .9s cubic-bezier(.2,1.4,.4,1)}
.confetti{position:fixed;top:-12px;width:8px;height:14px;border-radius:2px;z-index:81;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
@keyframes wIn{from{opacity:0}to{opacity:1}}
@keyframes wPop{from{transform:scale(.4) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.pbadge,.pbadge:after,.tapfx,.confetti{animation:none!important}#sportsArt svg{transform:none!important}}
/* badge unlock burst */
.bburst{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(var(--orange-rgb),.38),rgba(1,57,25,0) 60%),linear-gradient(160deg,#013919,#00230f);color:#fff;text-align:center;animation:wIn .25s ease}
.bburst.out{opacity:0;transition:opacity .3s}
.bb-rays{position:absolute;top:42%;left:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.10) 0 8deg,rgba(255,255,255,0) 8deg 22deg);border-radius:50%;animation:bbSpin 6s linear infinite;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.bb-medal{position:relative;width:128px;height:128px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,var(--orange) 55%,#7a3a00);box-shadow:0 0 0 6px rgba(255,255,255,.18),0 0 40px rgba(var(--orange-rgb),.8);animation:bbPop .7s cubic-bezier(.2,1.6,.4,1)}
.bb-medal span{width:58px;height:58px;color:#013919;display:grid;place-items:center}.bb-medal svg{width:58px;height:58px}
.bb-eyebrow{margin-top:22px;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.85}
.bb-name{font-size:28px;font-weight:900;letter-spacing:-.4px;margin-top:4px;animation:bbUp .5s .15s both}
.bb-pts{margin-top:6px;font-size:20px;font-weight:900;color:var(--orange);animation:bbUp .5s .3s both}
.bb-tap{margin-top:26px;font-size:12px;opacity:.6}
.bb-spark{position:absolute;top:42%;left:50%;width:8px;height:8px;border-radius:2px;animation:bbSpark .9s ease-out both}
@keyframes bbSpin{to{transform:rotate(360deg)}}
@keyframes bbPop{0%{transform:scale(.2) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes bbUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@keyframes bbSpark{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.3) rotate(260deg);opacity:0}}
/* rulebook */
.rb details{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:8px 0;background:#fff}
.rb summary{font-weight:800;padding:10px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.rb summary:after{content:"+";font-size:20px;color:var(--orange-ink)}
.rb details[open] summary:after{content:"\2212"}
.rb .bprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.rb .bprog i{display:block;height:100%;background:var(--orange)}
@media (prefers-reduced-motion:reduce){.bb-rays,.bb-medal,.bb-spark,.bb-name,.bb-pts{animation:none!important}}
/* team + brand badges, top right on every screen */
:root{--epc-purple:#4a2d76;--epc-purple-rgb:74,45,118;--epc-teal:#4eb0d6;--epc-teal-rgb:78,176,214}
.hdr-badges{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.epc-chip{display:inline-flex;align-items:center;height:30px;padding:3px 8px;border-radius:10px;background:linear-gradient(135deg,var(--epc-purple),#2f1b50);box-shadow:0 0 0 1px rgba(var(--epc-teal-rgb),.55) inset,0 3px 10px rgba(var(--epc-purple-rgb),.35)}
.epc-chip img{height:22px;width:auto;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.cpe-chip{position:relative;display:inline-flex;align-items:center;opacity:.82;transition:opacity .2s}
.cpe-chip .cpe-logo{height:18px;width:auto;border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 2px 6px rgba(0,0,0,.12)}
.cpe-chip sup{position:absolute;top:-5px;right:-9px;font-size:7px;font-weight:900;letter-spacing:.3px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 2px;line-height:9px}
.cpe-date{margin-top:4px}
/* tap blur in EPC Tropics purple + teal */
.btn:active,.chip:active,.iconbtn:active,.menu button:active,a.btn:active,.tile:active{box-shadow:0 0 0 4px rgba(var(--epc-teal-rgb),.25),0 6px 18px rgba(var(--epc-purple-rgb),.30)}
/* weekly medals */
.mburst{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;animation:wIn .3s ease;overflow:hidden}
.mburst.out{opacity:0;transition:opacity .3s}
.m-gold{background:radial-gradient(circle at 50% 40%,rgba(255,215,94,.55),rgba(1,57,25,0) 62%),linear-gradient(160deg,#1c3a12,#00230f)}
.m-silver{background:radial-gradient(circle at 50% 40%,rgba(210,218,226,.28),rgba(30,36,44,0) 60%),linear-gradient(160deg,#2a313a,#14181d)}
.m-bronze{background:linear-gradient(160deg,#3a2a1e,#1d1510)}
.m-poop{background:radial-gradient(circle at 50% 42%,rgba(122,74,34,.5),rgba(0,0,0,0) 60%),linear-gradient(160deg,#2b1a0c,#120a04)}
.m-golden{background:radial-gradient(circle at 50% 40%,rgba(255,215,94,.75),rgba(74,45,118,.3) 45%,rgba(0,0,0,0) 70%),linear-gradient(160deg,#2f1b50,#0d0618)}
.mb-rays{position:absolute;top:40%;left:50%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.22) 0 7deg,rgba(255,255,255,0) 7deg 20deg);border-radius:50%;animation:bbSpin 7s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%)}
.m-golden .mb-rays{background:repeating-conic-gradient(from 0deg,rgba(255,226,140,.35) 0 6deg,rgba(78,176,214,.12) 6deg 12deg,rgba(255,255,255,0) 12deg 20deg);animation-duration:4s}
.mb-medal{position:relative;z-index:1}
.m-gold .mb-medal{animation:bbPop .8s cubic-bezier(.2,1.6,.4,1),goldGlow 1.6s ease-in-out infinite .8s}
.m-silver .mb-medal{animation:bbPop .7s ease,sway 2.4s ease-in-out infinite .7s}
.m-bronze .mb-medal{animation:wIn .9s ease;filter:saturate(.7)}
.m-poop .mb-medal{animation:poopDrop .9s cubic-bezier(.3,1.5,.5,1),poopShake .5s ease-in-out 1s 3}
.m-golden .mb-medal{animation:goldenIn 1.2s cubic-bezier(.2,1.5,.4,1),goldGlow 1.2s ease-in-out infinite 1.2s}
.mb-eyebrow{margin-top:20px;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.8;position:relative}
.mb-name{font-size:32px;font-weight:900;letter-spacing:-.5px;margin-top:4px;position:relative;animation:bbUp .5s .2s both}
.m-golden .mb-name{font-size:30px;background:linear-gradient(90deg,#fff4c2,#ffd75e,#f6a800,#fff4c2);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bbUp .5s .2s both,shine 2.5s linear infinite}
.m-gold .mb-name{color:#ffd75e}.m-silver .mb-name{color:#dfe5ea}.m-bronze .mb-name{color:#d39a6a;opacity:.85}.m-poop .mb-name{color:#e0b07a;font-size:36px}
.mb-sub{margin-top:8px;font-size:16px;opacity:.9;max-width:320px;position:relative;animation:bbUp .5s .35s both}
.m-bronze .mb-sub,.m-silver .mb-sub{opacity:.7}
.mini-poop{position:absolute;top:-60px;animation:fall linear forwards;opacity:.9}
.medal-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.medal-row .mc{display:inline-flex;align-items:center;gap:3px;font-weight:900}
.wkdots{display:flex;gap:6px;margin-top:10px}
.wkdots span{flex:1;height:34px;border-radius:9px;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink-2)}
.wkdots span.h5{background:var(--green);color:#fff}.wkdots span.h4{background:#2f7a4f;color:#fff}.wkdots span.h3{background:#8bb89a;color:#fff}.wkdots span.h2,.wkdots span.h1{background:#d9e6dd}
@keyframes goldGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,215,94,.6))}50%{filter:drop-shadow(0 0 28px rgba(255,215,94,1))}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes poopDrop{0%{transform:translateY(-120vh) scale(1.4)}70%{transform:translateY(20px) scale(1.1,.85)}100%{transform:none}}
@keyframes poopShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes goldenIn{0%{transform:scale(.1) rotate(-540deg);opacity:0}70%{transform:scale(1.15) rotate(10deg);opacity:1}100%{transform:none}}
@keyframes shine{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.mburst *{animation:none!important}}
/* EPC Tropics jersey logo pop */
.tropics-pop{margin:4px auto 12px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 2px rgba(var(--epc-teal-rgb),.55),0 10px 26px rgba(var(--epc-purple-rgb),.38);animation:tropPop .6s cubic-bezier(.2,1.5,.4,1) both}
.tropics-pop img{display:block;width:100%;height:auto}
@keyframes tropPop{0%{transform:scale(.6) rotate(-4deg);opacity:0}100%{transform:none;opacity:1}}
/* close X on every pop-up sheet */
.sheet-x{position:sticky;top:0;float:right;z-index:6;width:38px;height:38px;margin:2px -2px 0 8px;border-radius:50%;display:grid;place-items:center;font-size:26px;line-height:1;font-weight:400;color:var(--ink);background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08)}
@media (prefers-reduced-motion:reduce){.tropics-pop{animation:none}}
/* v2.8.2: exact Copy Paste Empire logo, small, top right */
.cpe-chip{opacity:1}
.cpe-chip .cpe-logo{height:24px;width:auto;border-radius:7px;background:#000;box-shadow:0 2px 8px rgba(0,0,0,.18)}
/* Opening Day show */
.show-hd{text-align:center;margin:6px 0 12px}.show-hd h2{margin:4px 0;font-size:24px;letter-spacing:-.4px}
.show-total{text-align:center;margin:6px 0 12px}.show-total span{display:block;font-size:56px;font-weight:900;color:var(--green);line-height:1;letter-spacing:-1px}.show-total small{color:var(--ink-2);font-weight:700}
.show-total.bump span{animation:bump .4s ease}
@keyframes bump{50%{transform:scale(1.15);color:var(--orange-ink)}}
.task-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.task{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;text-align:left;min-height:56px}
.task span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-weight:900;color:var(--green);flex:none}
.task b{flex:1;font-size:14px}.task em{font-style:normal;font-weight:900;color:var(--orange-ink)}
.task.on{border-color:var(--green);background:var(--green-tint);animation:bump .35s ease}.task.on span{background:var(--green);color:#fff}
.allin-hint{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;text-align:center}
.allin-hint.on{background:var(--green);color:#fff;animation:bump .5s ease}
.week-demo{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:background .25s}
.wd small{font-weight:800;color:var(--ink-2)}.wd b{font-size:18px}.wd i{font-style:normal;font-size:8px;letter-spacing:1px;color:var(--green)}
.wd.h3,.wd.h4{background:#cfe6d6}.wd.h5{background:var(--green);color:#fff}.wd.h5 small,.wd.h5 i{color:#fff}
.ladder{display:flex;gap:8px}.ladder-step{flex:1;display:flex;align-items:center;gap:6px;padding:8px;border-radius:12px;border:1px dashed var(--line);opacity:.45;filter:grayscale(.8);transition:all .3s}
.ladder-step.lit{opacity:1;filter:none;border-style:solid;border-color:var(--green);background:var(--green-tint)}
.ladder-step.pop{animation:bump .5s ease}
.month-demo .md-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);opacity:0;animation:bbUp .4s both}
.md-row b{width:48px}.md-row em{margin-left:auto;font-style:normal;font-weight:900;color:var(--green)}
.md-m{opacity:0;animation:bbPop .5s both}
.golden-win{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#2f1b50,#4a2d76);color:#fff;animation:bbUp .5s 1.2s both}
.season-line{display:flex;justify-content:space-between;gap:8px;position:relative;margin:4px 0 12px}
.season-line:before{content:"";position:absolute;top:27px;left:12%;right:12%;height:3px;background:linear-gradient(90deg,var(--orange),#ffd75e,var(--green));border-radius:2px}
.sl-step{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;opacity:0;animation:bbPop .6s both}
.sl-step small{color:var(--ink-2);font-weight:700}
.season-flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-weight:800;font-size:13px}
.season-flow span{padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}.season-flow i{font-style:normal;color:var(--orange-ink)}
.season-flow .win{background:var(--green);color:#fff;border-color:var(--green)}
/* medal ladder on Today */
.mladder{display:flex;gap:8px;margin-top:10px}
.mladder .ms{flex:1;text-align:center;padding:8px 4px;border-radius:12px;border:1px solid var(--line);position:relative}
.mladder .ms.got{border-color:var(--green);background:var(--green-tint)}
.mladder .ms.next{border:2px solid var(--orange);animation:dangle 2.4s ease-in-out infinite}
.mladder .ms:not(.got) svg{filter:grayscale(.6);opacity:.55}
.mladder .ms.next svg{filter:none;opacity:1}
.mladder b{display:block;font-size:13px}.mladder small{color:var(--ink-2);font-weight:700}
@keyframes dangle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-3px)}}
.odcount{text-align:center}.odcount .n{font-size:44px;font-weight:900;color:var(--green);line-height:1}
.sheet-panel.tall{min-height:88vh}
/* Today's scorecard */
.scorecard .sc-total{font-size:40px;font-weight:900;color:var(--green);line-height:1;letter-spacing:-1px}
.scr{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;transition:background .25s,border-color .25s}
.scr.ok{border-color:var(--green);background:var(--green-tint)}
.scr-top{display:flex;align-items:center;gap:10px}
button.scr-ck{padding:0;background:#fff;cursor:pointer;width:44px;height:44px;font-size:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
button.scr-ck:active{transform:scale(.9)}
button.scr-t{background:none;border:0;padding:4px 0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.scr-go{color:var(--orange-ink);font-weight:900}
.od-mini{display:flex;align-items:center;gap:12px;padding:12px 14px}
.od-mini img{width:74px;height:40px;object-fit:cover;border-radius:8px;flex:none}
.od-mini b{font-size:18px}
.verse-mini{display:block;width:100%;text-align:left;padding:12px 14px;background:linear-gradient(135deg,#2f1b50,#4a2d76);color:#fff;border:0;cursor:pointer}
.verse-mini .vm-ref{display:block;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#ffd75e}
.verse-mini .vm-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:600 15px/1.4 Georgia,"Times New Roman",serif;margin-top:4px}
.verse-mini.open .vm-t{-webkit-line-clamp:unset;display:block}
.verse-mini .vm-more{display:block;font-size:11px;opacity:.7;margin-top:4px}
.verse-mini .vm-pr{display:block;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.2);font-size:13px}
.verse-mini .vm-pr b{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#ffd75e}
.scr-ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px}
.scr.ok .scr-ck{background:var(--green);border-color:var(--green)}
.scr-t{flex:1;min-width:0}.scr-t b{display:block;font-size:15px}.scr-t small{color:var(--ink-2);font-size:12px}
.scr-top em{font-style:normal;font-weight:900;color:var(--orange-ink);white-space:nowrap}
.scr-ctl{margin-top:8px}.scr-ctl .chip{min-height:40px;padding:0 10px}
.scr.water{border-left:4px solid rgba(var(--epc-teal-rgb),.85)}
.wg-link{display:block;margin:8px 0 0;padding:4px 0;background:none;border:0;color:var(--ink-2);font-size:13px;font-weight:700;text-decoration:underline}
.wg-edit{display:flex;align-items:center;gap:8px;margin-top:10px}
.wg-edit span{font-size:13px;font-weight:800;color:var(--ink-2);flex:1}
.wg-edit b{font-size:17px;min-width:64px;text-align:center}
.scr.water.ok{background:linear-gradient(135deg,rgba(var(--epc-teal-rgb),.28),var(--green-tint))}
.scr.water .scr-top em{font-size:18px}
.wbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:2px}.wbar i{display:block;height:100%;background:linear-gradient(90deg,#4eb0d6,#2b8fc0);transition:width .5s ease}
.allin-bar{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:2px;font-size:13px}
.allin-bar.on{background:var(--green);color:#fff;animation:bump .5s ease}
/* bigger Tropics logo on the Golden badge */
/* final score scene */
.final-stack{display:flex;flex-direction:column;gap:8px}
.fs-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;opacity:0;animation:bbUp .45s both}
.fs-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--green-tint);font-weight:900;color:var(--green);font-size:18px}
.fs-t{flex:1;min-width:0}.fs-t b{display:block}.fs-t small{color:var(--ink-2);font-size:12px}
.fs-row em{font-style:normal;font-weight:900;color:var(--orange-ink);font-size:17px}
.fs-total{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,var(--green),#0e5a2e);color:#fff;opacity:0;animation:bbPop .6s both;margin-top:4px}
.fs-total span{font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:13px}.fs-total b{font-size:34px;font-weight:900;letter-spacing:-1px}

/* v2.9.4: golden plaque, check splash, live rivals, cleaner workout mode */
.gtb2{position:relative;display:inline-block;width:calc(var(--s)*1.6);height:var(--s);vertical-align:middle;flex:none}
.gtb2 .g-frame{position:absolute;inset:0;border-radius:calc(var(--s)*.2);padding:calc(var(--s)*.065);background:linear-gradient(145deg,#fff8d2 0%,#ffd84f 20%,#c88700 46%,#ffe78f 60%,#b37400 80%,#ffd24a 100%);box-shadow:0 0 0 max(1px,calc(var(--s)*.018)) #6b4300,0 calc(var(--s)*.04) calc(var(--s)*.22) rgba(255,186,30,.65),inset 0 max(1px,calc(var(--s)*.02)) 0 rgba(255,255,255,.75);overflow:hidden}
.gtb2 .g-frame:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.8) 50%,transparent 58%);animation:gSheen 3.4s ease-in-out infinite;pointer-events:none}
.gtb2 img{display:block;width:100%;height:100%;object-fit:contain;background:#3b2867;border-radius:calc(var(--s)*.14);box-shadow:0 0 0 max(1px,calc(var(--s)*.014)) #5a3a00}
.gtb2 .g-stars{position:absolute;left:50%;top:calc(var(--s)*-.2);transform:translateX(-50%);color:#ffd75e;font-size:calc(var(--s)*.17);line-height:1;letter-spacing:.12em;text-shadow:0 0 6px #ffb300,0 1px 0 #7a4d00;white-space:nowrap}
.gtb2 .g-rib{position:absolute;left:50%;bottom:calc(var(--s)*-.17);transform:translateX(-50%);background:linear-gradient(#ffe682,#d79800);color:#3a2200;font:900 calc(var(--s)*.115)/1 system-ui,sans-serif;letter-spacing:.16em;padding:calc(var(--s)*.055) calc(var(--s)*.17);border-radius:999px;border:1px solid #7a4d00;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap}
.gtb2 .g-tw{position:absolute;color:#fff6c8;font-size:calc(var(--s)*.16);text-shadow:0 0 8px #ffd75e;animation:gTw 1.8s ease-in-out infinite}
@keyframes gSheen{0%{transform:translateX(-60%)}55%,100%{transform:translateX(60%)}}
@keyframes gTw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
.fs-ic .gtb2,.fs-ic .gtb3{--s:22px!important}
.gtb3{display:inline-block;width:calc(var(--s)*1.6);height:var(--s);vertical-align:middle;flex:none;filter:drop-shadow(0 calc(var(--s)*.04) calc(var(--s)*.12) rgba(255,186,30,.55))}
.gtb3 img{display:block;width:100%;height:100%;object-fit:contain}
.splash{position:fixed;z-index:120;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%) scale(.1);background:radial-gradient(circle,rgba(255,255,255,.9) 0 12%,var(--sp1) 13% 38%,var(--sp2) 39% 58%,transparent 60%);opacity:.95;animation:splashGo .6s cubic-bezier(.15,.8,.3,1) forwards}
.splash.ring{background:none;border:4px solid var(--sp1);animation:splashRing .7s ease-out forwards}
@keyframes splashGo{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes splashRing{to{transform:translate(-50%,-50%) scale(1.25);opacity:0;border-width:1px}}
.plus-fly{position:fixed;z-index:121;pointer-events:none;font:900 22px/1 system-ui,sans-serif;color:var(--sp1);text-shadow:0 2px 0 #fff,0 0 12px rgba(255,255,255,.9);transform:translate(-50%,-50%);animation:plusFly 1s ease-out forwards}
@keyframes plusFly{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.flood{position:fixed;inset:0;z-index:130;display:grid;place-items:center;align-content:center;gap:10px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 45%,var(--sp1),var(--sp2) 70%);animation:floodIn .35s ease-out both}
.flood.out{animation:floodOut .4s ease-in forwards}
.flood svg{width:150px;height:150px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.flood svg circle{stroke-dasharray:440;stroke-dashoffset:440;animation:drawC .55s .1s ease-out forwards}
.flood svg path{stroke-dasharray:120;stroke-dashoffset:120;animation:drawC .4s .55s ease-out forwards}
.flood b{font:900 34px/1.05 system-ui,sans-serif;letter-spacing:-.01em;animation:bbUp .4s .5s both}
.flood span{font-weight:800;font-size:18px;opacity:.95;animation:bbUp .4s .7s both}
@keyframes floodIn{from{clip-path:circle(0% at var(--fx,50%) var(--fy,50%))}to{clip-path:circle(150% at var(--fx,50%) var(--fy,50%))}}
@keyframes floodOut{to{opacity:0}}
@keyframes drawC{to{stroke-dashoffset:0}}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:4px 9px;border-radius:999px;white-space:nowrap}
.live-pill i{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:livePulse 1.8s infinite}
.live-pill.off i{background:#c8ccc9;animation:none}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.rv-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.rv-row:last-of-type{border-bottom:0}
.rv-name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;min-width:0}
.rv-name .dot{width:11px;height:11px;border-radius:50%;flex:none}
.rv-today{text-align:right;font-weight:900;font-size:24px;line-height:1}
.rv-today small{display:block;font-size:10px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.rv-sub{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rv-dots{display:flex;gap:5px}
.rv-dots span{font-size:11px;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--surface);color:var(--dim);border:1px solid var(--line)}
.rv-dots span.on{background:var(--c);border-color:var(--c);color:#fff}
.rv-feed{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.rv-feed div{font-size:13px;padding:3px 0;animation:bbUp .4s both}
.rv-feed .ago{color:var(--dim);font-size:11px;margin-left:4px}
.wo-top{position:sticky;top:calc(-1 * (var(--st) + 10px));z-index:6;margin:-10px -16px 12px;padding:calc(var(--st) + 10px) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.wo-prog{flex:1;min-width:0}
.wo-prog .t{display:flex;justify-content:space-between;font-size:13px;font-weight:800;gap:8px}
.wo-prog .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.wo-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--epc-teal),var(--orange));transition:width .35s}
.wo-top .seg{width:118px!important;flex:none}
.ex.cur{border:2px solid var(--orange);box-shadow:0 6px 20px rgba(var(--orange-rgb),.18)}
.ex.done{background:var(--green-tint);border-color:transparent}
.ex.done .nm:after{content:" ✓";color:var(--green)}
.ex.done .exmore,.ex.done .meta2{display:none}
.ex .set{width:58px;height:58px;font-size:18px}
.ex .set.on{transform:scale(1.04);box-shadow:0 0 0 4px rgba(var(--orange-rgb),.22)}
.exmore{margin-top:6px;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
.exmore>summary{font-size:13px;font-weight:800;color:var(--green);cursor:pointer;list-style:none;display:inline-flex;padding:8px 0;min-height:0;justify-content:flex-start}.exmore>summary:after{content:none!important}
.exmore summary::-webkit-details-marker{display:none}
.exmore summary:before{content:"+ "}
.exmore[open] summary:before{content:"− "}
.sb-seg{margin:12px 0 8px;width:100%}
.hero-mini{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hero-mini img{width:42px;height:42px;border-radius:11px;flex:none}
.hero-mini h2{margin:2px 0 0;font-size:20px;line-height:1.15}
.wo-mini{padding:14px}
.wo-mini-t{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:block;width:100%}
.wo-mini-t .eyebrow{display:block}
.wo-mini-t b{display:block;font-size:19px;margin-top:4px;line-height:1.2}
.line-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;cursor:pointer;color:inherit;font:inherit}
.line-card img{width:64px;height:36px;object-fit:cover;border-radius:7px;flex:none}
.line-card b{display:block;font-size:15px}
.line-card small{display:block;font-size:12px;color:var(--ink-2)}
.line-bar{display:block;height:6px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.line-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--epc-teal),var(--orange));border-radius:4px}
.rivals-mini{display:block;width:100%;text-align:left;padding:12px 14px;cursor:pointer;color:inherit;font:inherit}
.rm-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.rm-row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.rm-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rm-dots{display:flex;gap:3px}
.rm-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.rm-dots i.on{background:var(--c)}
.rm-row em{font-style:normal;font-weight:900;min-width:34px;text-align:right}
.rivals-mini > .small{display:block;margin-top:8px}
.more-today{padding:0}
.more-today > summary{padding:16px;font-weight:900;font-size:16px;cursor:pointer;list-style:none}
.more-today > summary::-webkit-details-marker{display:none}
.more-today > summary:after{content:"+";float:right;color:var(--orange-ink)}
.more-today[open] > summary:after{content:"−"}
.more-today > .card,.more-today > .banner,.more-today > .grid3{margin:0 12px 12px}
.scorecard .scr{padding:8px 10px;margin-top:6px}
.scorecard .scr-ctl{margin-top:6px}
.scorecard .scr-ctl .chip,.scorecard .scr-ctl .seg button,.scorecard .scr-ctl input{min-height:44px}
.wg-link{min-height:44px}
.verse-card{margin-top:16px;background:linear-gradient(135deg,#2f1b50,#4a2d76);color:#fff;border:0;text-align:center}
.verse-card blockquote{margin:10px 4px 8px;font-size:19px;line-height:1.45;font-weight:700;font-family:Georgia,"Times New Roman",serif}
.verse-ref{font-weight:900;color:#ffd75e;letter-spacing:.04em}
.verse-ref span{font-size:10px;opacity:.7;margin-left:4px}
.verse-pray{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;line-height:1.45}
.verse-pray b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ffd75e;margin-bottom:4px}
.tour-step{display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-ink);margin:-4px 0 8px}
.wn-grid{display:grid;gap:8px}
.wn-item{background:var(--card2);border-radius:14px;padding:10px 12px;border-left:4px solid var(--orange);animation:bbUp .35s both}
.wn-item b{display:block;font-size:15px}
.wn-item span{font-size:13px;color:var(--ink-2)}
.at-tab{background:var(--card2);border-radius:16px;padding:12px;margin-bottom:10px}
.at-hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:17px}
.at-ico{width:34px;height:34px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center;flex:none}
.at-ico svg{width:20px;height:20px}
.at-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.at-row em{font-style:normal;font-weight:900;color:var(--green);white-space:nowrap}
.climb{display:grid;gap:4px;text-align:center}
.climb-step{background:var(--card2);border-radius:16px;padding:12px}
.climb-step b{display:block;font-size:16px}
.climb-step span{font-size:13px;color:var(--ink-2)}
.climb-step.gold{background:linear-gradient(135deg,#2f1b50,#4a2d76);color:#fff}
.climb-step.gold span{color:#e9dcff}
.climb-arrow{color:var(--orange);font-size:14px}
.sb-rank{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;margin-bottom:6px;background:var(--surface)}
.sb-rank.me{outline:2px solid var(--orange)}
.sb-rank .dot{width:12px;height:12px;border-radius:50%;flex:none}
.sb-pos{font-weight:900;width:16px;color:var(--dim)}
.sb-pts{font-weight:900;font-size:22px;margin-left:auto}
.sb-svg{display:block;margin-top:10px}
.sb-legend{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:800;margin-top:4px}
.sb-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sb-empty{display:grid;gap:4px;text-align:center;padding:18px 10px;margin:6px 0 10px;border:2px dashed var(--line);border-radius:14px}
.sb-empty span{font-size:13px;color:var(--dim)}
.hc-scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.hc-scale button{height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:900;font-size:15px;color:var(--ink)}
.hc-scale button.on{background:#2f9e5b;border-color:#2f9e5b;color:#fff;transform:scale(1.08)}
.hc-scale button.md.on{background:#e8a317;border-color:#e8a317}
.hc-scale button.hi.on{background:#d64545;border-color:#d64545}
.exl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.exl:last-child{border-bottom:0}
.exl .nm{font-weight:800}
.exl .rx{font-weight:900;white-space:nowrap;color:var(--ink)}
.wo-finish{position:sticky;bottom:calc(var(--sb) + 12px);z-index:6;min-height:62px!important;font-size:18px!important;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.wo-finish.ready{animation:finGlow 1.4s ease-in-out infinite}
@keyframes finGlow{0%,100%{box-shadow:0 0 0 0 rgba(var(--orange-rgb),.55),0 10px 30px rgba(0,0,0,.18)}50%{box-shadow:0 0 0 10px rgba(var(--orange-rgb),0),0 10px 30px rgba(0,0,0,.18)}}
@media (prefers-reduced-motion:reduce){.splash,.plus-fly,.flood,.flood *,.gtb2 *,.live-pill i,.wo-finish.ready{animation:none!important}.flood svg circle,.flood svg path{stroke-dashoffset:0}}
</style>

/* ---------------------------- WEEKLY SCOREBOARD (friendly competition) ---------------------------- */
function myWeekScore(ws) {
  const t = todayStr(); const st = { workouts: 0, quick: 0, active: 0, water: 0, protein: 0, readMin: 0, sleep: 0, miles: 0 };
  for (let i = 0; i < 7; i++) {
    const s = addDays(ws, i); if (s > t) break; const l = S.logs[s]; if (!l) continue;
    if (l.done) st.workouts++; else if (l.mvdDone) st.quick++;
    if (l.done || l.mvdDone || (l.checks && l.checks.court) || l.reading > 0 || l.miles > 0) st.active++;
    st.milesPts = (st.milesPts || 0) + Math.min(6, +l.miles || 0) * 5; st.miles += +l.miles || 0;
    if (l.water >= waterGoal(s)) st.water++;
    if (l.protein >= S.profile.protein) st.protein++;
    st.readMin += Math.min(60, l.reading || 0);
    if (l.sleep) st.sleep++;
  }
  let score = 0; for (let i = 0; i < 7; i++) { const d = addDays(ws, i); if (d > t) break; score += Object.values(dayPoints(d)).reduce((a, v) => a + v, 0); }
  delete st.milesPts; st.miles = Math.round(st.miles * 10) / 10;
  return { score, stats: st };
}

  fetch("/.netlify/functions/scoreboard", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: PID, name: myName(), accent: ACCENT, week: ws, score: me.score, stats: me.stats, season }) })

   Everything lands on the Review screen first. Parsing lives in schedule-lib.js (GS_SCHED). */

    else if (e.type === "practice") intensity = "medium";

}

const fileInput = (accept, capture) => { const i = document.createElement("input"); i.type = "file"; i.accept = accept; if (capture) i.setAttribute("capture", "environment"); i.style.display = "none"; document.body.appendChild(i); return i; };

  const text = await f.text();

const hostOf = u => { try { return new URL(u.replace(/^webcal/i, "https")).hostname.replace(/^www\./, ""); } catch (e) { return "Calendar"; } };

/* ---------- Review ---------- */
function teamFilter(evs, team, src) {
  if (!team) return evs;
  if (src.kind === "csv") return GS_SCHED.csvToEvents(src.rows, src.det, { myTeam: team });
  const t = team.toLowerCase();
  return evs.filter(e => !(e.home || e.away) || [e.home, e.away].some(x => (x || "").toLowerCase() === t)).map(e => {
    if (!(e.home || e.away)) return e;
    const home = (e.home || "").toLowerCase() === t, opp = home ? e.away : e.home;
    return Object.assign({}, e, { homeAway: home ? "home" : "away", opponent: opp, title: (home ? "vs " : "@ ") + opp });
  });
}
function openReview(src, evs, teams, myTeam) {
  UI.rv = { src, all: evs, teams: teams || [], myTeam: myTeam || "", items: [] };
  buildReviewItems(); openSheet("review");
}
function buildReviewItems() {
  const rv = UI.rv, t = todayStr();
  rv.items = teamFilter(rv.all, rv.myTeam, rv.src).map(e => {
    const dup = (S.events || []).find(x => GS_SCHED.sameEvent(x, Object.assign({ uid: e.uid }, e)));
    const changed = dup && (dup.start !== e.start || (e.location && dup.location !== e.location));
    return Object.assign({}, e, { sel: !(e.date < t) && !dup && !(e.conf != null && e.conf < 0.5), past: e.date < t, dup: dup ? dup.id : null, changed, low: e.conf != null && e.conf < 0.75, edit: false });
  });
}
function impactOf(items) {

  const dates = sel.map(x => x.date).sort(), from = addDays(dates[0], -2), to = addDays(dates[dates.length - 1], 2);
  const snap = (() => { const m = {}; for (let d = from; d <= to; d = addDays(d, 1)) { const i = dayInfo(d); m[d] = i.type + (i.midday ? "*" : ""); } return m; })();
  const keep = S.events; S.events = keep.filter(e => !sel.some(x => x.dup === e.id)).concat(sel.map(x => normEvent(x, "preview"))); invalidate();
  let changed = 0, game = 0, pre = 0, sleep = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) { const i = dayInfo(d), v = i.type + (i.midday ? "*" : ""); if (v !== snap[d]) { changed++; if (i.type === "GAME_DAY") game++; if (i.type === "PRE_COURT") pre++; if (i.midday) sleep++; } }
  S.events = keep; invalidate();
  return { changed, game, pre, sleep };
}

function doImport() {

function undoImport(id) {

  S.events = S.events.filter(e => !im.added.includes(e.id));
  (im.updated || []).forEach(u => { const i = S.events.findIndex(e => e.id === u.id); if (i >= 0) S.events[i] = u; });
  if (im.feedId) S.feeds = S.feeds.filter(f => f.id !== im.feedId);
  S.imports = S.imports.filter(x => x.id !== id); invalidate(); save(); toast("Import undone"); closeSheet(); render();
}

/* ---------- Feed auto-sync ---------- */
async function syncFeeds(force) {
  if (!onlineHost() || !navigator.onLine || !(S.feeds || []).length) return;
  const changes = [];
  for (const f of S.feeds) {
    if (!f.autoSync && !force) continue;
    if (!force && f.lastSync && Date.now() - new Date(f.lastSync) < 6 * 3600e3) continue;
    try {
      const r = await fetch(SCHED_API.fetch + "?url=" + encodeURIComponent(f.url), { cache: "no-store" }); if (!r.ok) continue;
      const evs = GS_SCHED.parseICS(await r.text()), h = GS_SCHED.hashEvents(evs);
      f.lastSync = new Date().toISOString(); if (h === f.lastHash) continue; f.lastHash = h;
      const mine = S.events.filter(e => e.source && e.source.feedId === f.id), t = todayStr(), seen = new Set();
      evs.forEach(n => {
        const ex = mine.find(e => (n.uid && e.source.uid === n.uid) || GS_SCHED.sameEvent(e, n));
        if (ex) { seen.add(ex.id); if (ex.date !== n.date || ex.start !== n.start || ex.cancelled) { changes.push(ex.title + " moved to " + fmtD(n.date) + (n.start ? " " + fmtT(n.start) : "")); Object.assign(ex, { date: n.date, start: n.start, end: n.end, location: n.location || ex.location, cancelled: false }); } }
        else if (n.date >= t) { const ev = normEvent(n, "feed", { source: { kind: "feed", feedId: f.id, uid: n.uid || null } }); S.events.push(ev); seen.add(ev.id); changes.push("New: " + ev.title + " " + fmtD(ev.date)); }
      });
      mine.forEach(e => { if (!seen.has(e.id) && e.date >= t && !e.cancelled) { e.cancelled = true; changes.push(e.title + " on " + fmtD(e.date) + " was cancelled"); } });
    } catch (e) {}
  }
  if (changes.length) { S.schedAlert = { date: todayStr(), msgs: changes.slice(0, 6) }; invalidate(); }
  save(); if (changes.length) rerenderAll();
}

/* ---------------------------- UPDATES: auto-update, update bar, What's new ----------------------------
   Release steps: bump APP_VERSION + CHANGELOG here, "version" in version.json, and VERSION in sw.js. Deploy.
   Data lives in localStorage under the same key, so updates never touch anyone's logs. */
const cmpVer = (a, b) => { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < 3; i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
function whatsNewHTML() {
  return sheetTitle("What's new") + Object.keys(CHANGELOG).sort((a, b) => cmpVer(b, a)).map(v => `<div class="card"><div class="eyebrow">Version ${v}</div><ul class="list">${CHANGELOG[v].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`).join("") + `<div class="small muted">Updates install on their own. Your workouts, logs, and settings stay saved on your phone.</div>`;
}
function showWhatsNew() {
  const seen = S.meta.seenVersion; if (seen === APP_VERSION) return;
  UI.wnPending = APP_VERSION;   // saved as seen only when they close it, so a reload can't eat it
  const needSetup = needsSetup();
  if (!seen && !Object.keys(S.logs).length) { S.meta.seenVersion = APP_VERSION; UI.wnPending = null; save(); return false; }   // brand new user: nothing to announce
  if (S.meta.tourSeen !== TOUR_V) { UI.tourPage = 0; UI.demo = null; openSheet("tour"); return true; }
  const pitch = !S.meta.seasonHello; S.meta.seasonHello = 1; save();
  openSheet("result", `<div class="done-hero"><img src="icon-512.png" alt=""><h2>${pitch ? "Game Shape Season 1 is here" : "New update: v" + APP_VERSION}</h2><div class="muted">v${APP_VERSION}. All your data is still here. Same link, same home screen icon.</div></div>${pitch ? seasonPitch(false) : ""}<ul class="list">${(CHANGELOG[APP_VERSION] || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${!S.profile.nickname ? `<button class="btn block" style="margin-top:6px" data-act="nickGo">Add my nickname</button>` : ""}${needSetup ? `<button class="btn primary block" style="margin-top:14px" data-act="setupNow">Answer 3 quick questions</button>` : `<button class="btn primary block" style="margin-top:14px" data-act="closeSheet">Let's go</button>`}`);
  return true;
}
async function applyUpdate() {
  save(); window.__gsUpdating = true; window.__tapGuard = Date.now() + 60000; window.scrollTo(0, 0);
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) for (const r of await navigator.serviceWorker.getRegistrations()) { await r.update(); if (r.waiting) r.waiting.postMessage("SKIP_WAITING"); }
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch (e) {}
  location.reload();
}
async function checkUpdate(auto) {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return;
    const v = await r.json(); if (!v.version || cmpVer(v.version, APP_VERSION) <= 0) return;
    let tried = null; try { tried = sessionStorage.getItem("gs_upd_try"); } catch (e) {}
    if (auto && tried !== v.version) { try { sessionStorage.setItem("gs_upd_try", v.version); } catch (e) {} return applyUpdate(); }
    const b = $("updateBar");
    b.innerHTML = `<img src="icon-180.png" alt=""><div class="tx"><b>Update ready: v${esc(v.version)}</b>${esc((v.notes || [])[0] || "New features and fixes")}</div><button data-act="doUpdate">Update</button>`;
    b.classList.remove("hidden");
  } catch (e) {}
}
ACT.doUpdate = () => applyUpdate();
// Reload on a new service worker ONLY when the user (or auto-update) asked for it. The page is already served fresh from the network,
// so an unasked reload just wipes whatever is on screen (that's what made the update card flash and vanish).
if (navigator.serviceWorker) navigator.serviceWorker.addEventListener("controllerchange", () => { if (window.__gsUpdating && !window.__gsReloaded) { window.__gsReloaded = true; location.reload(); } });
setInterval(() => checkUpdate(false), 30 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(false); });

document.addEventListener("visibilitychange", () => { if (!document.hidden) syncScore(false); });
/* Tapped a store link? When they come back, ask if they bought it so the points and badge land. */
document.addEventListener("click", e => { const a = e.target.closest("a[data-buylink]"); if (!a) return; const ss = SSN(); if (ss.bought[a.dataset.buylink]) return; ss.pendingBuy = { id: a.dataset.buylink, at: Date.now() }; save(); }, true);
function askBought() {
  const ss = SSN(), pb = ss.pendingBuy; if (!pb || ss.bought[pb.id] || Date.now() - pb.at < 4000) return;
  if (Date.now() - pb.at > 3 * 864e5) { ss.pendingBuy = null; save(); return; }
  const b = bookById(pb.id); if (!b) return;
  openSheet("result", `<div class="done-hero"><img src="icon-512.png" alt=""><h2>Did you buy it?</h2><div class="muted">${esc(b.title)}</div></div><div class="small muted" style="text-align:center;margin-bottom:12px">Buying a book earns 2 points for every $1 you paid.</div><button class="btn primary block" data-act="buyBook" data-id="${esc(pb.id)}">Yes, I bought it</button><button class="btn block" style="margin-top:8px" data-act="buyNo">Not yet</button>`);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(askBought, 600); });
paintSportsArt();
if (S.meta.tourSeen !== TOUR_V) startLaunch(); else if (!maybeWelcome() && !showWhatsNew()) maybeSetup();
if (!UI.sheet && S.meta.tourSeen && !S.meta.health && !document.querySelector(".welcome")) openSheet("health");
checkUpdate(true);
loadBooks();
syncCommunity();
syncFeeds(false);
</script>
</body>
</html>
